  al_form_type = 'starts_case'
  ilao_easy_form_title = "Expunge or seal criminal records"
  ilao_easy_form_url = "https://www.illinoislegalaid.org/legal-information/criminal-record-expungement-or-sealing-request"
  form_name = "Request to Expunge and/or Seal Criminal Records"
