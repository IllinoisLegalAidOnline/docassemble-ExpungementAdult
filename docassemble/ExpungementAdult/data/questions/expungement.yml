code: |
  def eligibility_check( record ):

    # all offenses have baseline of not expungeable or sealable. eligibility and waiting periods applied through remaining logic.
    record.ex_eligible = False
    record.se_eligible = False

    # minor traffic offenses not eligible unless rwc
    if record.traffic and not record.rwc:
      return
  
    if record.rwc:
      record.ex_eligible = True
      record.ex_when = "now"
      record.se_eligible = True
      record.se_when = "now"
      return 
  
    if record.after_arrest == "dismissed":
      record.ex_eligible = True
      record.ex_when = "now"
      record.se_eligible = True
      record.se_when = "now"
      return  
  
    if record.after_arrest == "conviction":
      if not record.reversed_none:
        if record.reversed or record.pardon or record.certificate_ex or record.certificate_se or record.factually_innocent:
          if record.certificate_se or record.certificate_ex:
            if record.certificate_se:
              record.se_eligible = True
              record.se_when = "now"
            if record.certificate_ex:
              record.ex_eligible = True
              record.ex_when = "now"
            return
          else:
            record.ex_eligible = True
            record.ex_when = "now"
            return
      if record.reckless_conviction:
        if record.reckless_was_under_25_conviction:
          if not record.reckless_other_conviction:
            if record.reckless_now_25_conviction:
              record.se_eligible = True  
              if record.is_felony:
                record.se_when = "3"
              else:
                record.se_when = "2"  
              return  
      if record.unsealable:
        return
      else:
        record.se_eligible = True
        if record.is_felony:
          if record.must_register:
            return
          if record.human_trafficking:
            record.se_when = "last"
            return
          if record.discharge_type == "complete":
            record.se_when = "2"
            return
          if record.discharge_type == "revoked" or record.discharge_type == "jail":
            if ed_program_complete:
              record.se_when = "now"
              return
          record.se_when = "3"
        else:
          record.se_when = "2"  
        return
  
    if record.after_arrest == "diversion":
      if record.diversion_status == "incomplete":
        record.se_eligible = True
        if record.is_felony:
          record.se_when = "3"
        else:
          record.se_when = "2"  
        return
      elif record.diversion_status == "complete":
        record.ex_eligible = True
        record.ex_when = "now"
        return
      else: # will complete diversion within 61 days
        record.ex_eligible = True
        record.ex_when = "61"
        return
  
    if record.after_arrest == "qualified_probation":
      if record.qp_complete and record.qp_complete_plus_5:
        record.ex_eligible = True
        record.ex_when = "5"
        record.se_eligible = True
        record.se_when = "2"
        if record.qp_type == "second":
          record.se_when = "now"  
        return
      else:
        record.se_eligible = True
        if record.is_felony:
          record.se_when = "3"
        else:
          record.se_when = "2"  
        return

    if record.after_arrest == "weapons":
      record.se_eligible = True
      if record.weapons_complete:
        record.se_when = "now"  
      else:
        if record.is_felony:
          record.se_when = "3"
        else:
          record.se_when = "2"  
      return

    if record.after_arrest == "drugs":
      record.se_eligible = True
      if record.drugs_complete:
        record.se_when = "2"  
      else:
        if record.is_felony:
          record.se_when = "3"
        else:
          record.se_when = "2"  
      return
  
    if record.after_arrest == "supervision":
      if record.unsealable:
        return
  
      if record.supervision_exclusion == "none":  
        if not record.supervision_complete:
          record.se_eligible = True
          record.se_when = "2"  
          # if supervision can be for felonies use the below if, otherwise use above
          #if record.is_felony:
          #  record.se_when = "3"
          #else:
          #  record.se_when = "2"  
          return
       # these options are for supervision complete 
        if record.supervision_needs_5:
          if record.supervision_complete_plus_5:
            record.ex_eligible = True
            record.ex_when = "now"
            return
          else:
            record.se_eligible = True
            record.se_when = "2"  
            # if supervision can be for felonies use the below if, otherwise use above
            #if record.is_felony:
            #  record.se_when = "3"
            #else:
            #  record.se_when = "2"  
            return
        else:
          if record.supervision_complete_plus_2:
            record.ex_eligible = True
            record.ex_when = "now"
            return
          else:
            record.se_eligible = True
            record.se_when = "2"  
            # if supervision can be for felonies use the below if, otherwise use above
            #if record.is_felony:
            #  record.se_when = "3"
            #else:
            #  record.se_when = "2"  
            return
  
          if record.supervision_needs_2:
            if record.supervision_complete_plus_2:
              record.ex_eligible = True
              record.ex_when = "now"
              return
            else:
              record.se_eligible = True
              record.se_when = "2"  
              # if supervision can be for felonies use the below if, otherwise use above
              #if record.is_felony:
              #  record.se_when = "3"
              #else:
              #  record.se_when = "2"  
              return
  
      # check for supervision expungement exclusions: dui, sex offense v minor, or reckless driving
      if record.supervision_exclusion == "dui" or record.supervision_exclusion == "minor":
        record.se_eligible = True
        if record.is_felony:
          record.se_when = "3"
        else:
          record.se_when = "2"  
        return
      else: # reckless driving
        if record.reckless_was_under_25:
          if not record.reckless_other:
            if record.reckless_now_25:
              record.ex_eligible = True
              record.ex_when = "now"
              record.se_eligible = True  
              if record.is_felony:
                record.se_when = "3"
              else:
                record.se_when = "2"  
              return
        record.se_eligible = True  
        if record.is_felony:
          record.se_when = "3"
        else:
          record.se_when = "2"  
        return

    return
    # draft logic for all other records - might not ever be called
    # record.se_eligible = True
    # if record.is_felony:
    #   record.se_when = "3"
    # else:
    #   record.se_when = "2"  
    # return

        
---
id: eligibility report
generic object: DAList
continue button field: x[i].eligibility_report
question: |
  Eligibility
subquestion: |
  Based on your answers, records from the ${x[i].arrest_date} arrest may be eligible for:

  % if x[i].ex_eligible:
    * Expungement, ${format_waiting_period ( x[i].ex_when ) }
  % endif
  
  % if x[i].se_eligible:
    * Sealing, ${format_waiting_period ( x[i].se_when ) }
  % endif

  % if not x[i].ex_eligible and not x[i].se_eligible:
  * Neither expungement or sealing
  % endif
---
# adjust this function for last sentence for sealing eligibility. now=end of last sentence.
code: |
  def format_waiting_period( period ):
    if period == "now":
      return "right now."
    elif period == "last":
      return "after you complete your **{last sentence}**."
    elif period == "2":
      return "**two years** after you complete your **{last sentence}**."
    elif period == "3":
      return "**three years** after you complete your **{last sentence}**."
    elif period == "5":
      return "**five years** after you complete your **{last sentence}**."
    elif period == "61":
      return "after you successfully complete your problem-solving court or diversion program within 61 days of filing your expungement request."
    else:
      return "waiting period unknown"  
---
terms:
  - last sentence: |
      **Last sentence** means the latest completion date of any sentence you received in Illinois or any other state.
---
code: |
  if records.number_gathered() >= 24:
    records.there_is_another = False
---
id: eligibility summary
continue button field: eligibility_summary
question: |
  Which records do you want to include in your *Request*?
subquestion: |
  PLACEHOLDER
---


---
id: user name
sets:
    - users[0].name.first
question:  |
  What is your name?
subquestion: |
  You will be listed on the court forms as the proposed guardian.
fields:
  - code: |
      users[0].name_fields()
---
id: user birthdate
question: |
  When were you born?
fields:
  - Birthdate: users[0].birthdate
    datatype: BirthDate
    alMax: ${ today().format("yyyy-MM-dd") }
---
---
id: petitioner race
question: |
  What is your race?
subquestion: |
  This information is used to help make sure the correct records are expunged or sealed.
fields:
  - Race: users[0].race
    datatype: radio
    choices:
      - Asian: Asian
      - Black: Black
      - Hispanic: Hispanic
      - Latino: Latino
      - Middle Eastern: Middle Eastern 
      - Native American: Native American
      - Native Hawaiian: Native Hawaiian
      - North African: North African
      - Pacific Islander: Pacific Islander
      - White: White
      - 2 or more races: Multiracial
      - Other: other
  - Your race: user_race_other
    maxlength: 25
    show if:
      variable: users[0].race
      is: 'other'
---
id: petitioner gender
question: |
  What is your gender?
subquestion: |
  This information is used to help make sure the correct records are expunged or sealed.
fields:
  - Gender: users[0].gender
    datatype: radio
    required: False
    choices:
      - Male: Male
      - Female: Female
      - Other: other
  - Your gender: user_gender_other
    maxlength: 20
    required: False
    show if:
      variable: users[0].gender
      is: "other"
---
id: user address
question: |
  What is your address?
subquestion: |
  **This address will appear on your court papers.** You may receive court notices and documents about your case at this address.
fields:
  - Street address: users[0].address.address
    address autocomplete: True
  - Address line 2: users[0].address.unit
    required: False
  - City: users[0].address.city
  - State: users[0].address.state
    code: |
      states_list()
    default: IL      
  - ZIP code: users[0].address.zip


---
id: your contact information
question: |
  What is your contact information?
subquestion: |
  The court or other parties might need to contact you about this case.

  **This information will appear on your court forms.**
  
  If you do not want to list a phone number on your forms, leave it blank.

  If you have an email address, you must list it. Be sure to check your email daily, otherwise you may miss important court documents or information about your case.

  ${ collapse_template(contact_info_help) }  
fields:  
  - Phone number: users[0].phone_number
    datatype: al_international_phone
    required: False
  - label: |
      Do you have an email address?
    field: users[0].has_email_address      
    datatype: yesnoradio
  - note: |
      This email address will appear on your court forms. Be sure to check 
      this email daily, otherwise you may miss important information about 
      your case.
    show if:
      variable: users[0].has_email_address
      is: True
  - Email address: users[0].email    
    datatype: email
    show if: 
      variable: users[0].has_email_address
      is: True
---
template: contact_info_help
subject: |
  **What if I don't want to list my email address?**
content: |  
  If you do not want to enter your personal email address, you can create a new email account to get email about your case.
  
  To make a new email account try one of these email services:
  
  * [**Gmail**](https://accounts.google.com/SignUp)
  * [**Outlook**](https://outlook.live.com/owa/?nlp=1&signup=1)
  * [**Yahoo**](https://login.yahoo.com/account/create?.lang=en-US&.intl=us)
---
id: e-signature
question: |
  Do you want to add your e-signature to your forms?
subquestion: |  
  This program can put "**/s/ ${users[0].name_full()}**" where you would sign your name. The court will accept this as your signature.

  If you do not add your **{e-signature}** now, you must sign your paper forms before you file and deliver them.

  <div class="alert alert-info ilao-info" role="alert">
    <h6 class="alert-heading">What it means to sign your forms</h6>
    <p>By signing the <i>Request to Expunge and/or Seal Criminal Records</i>, you are certifying that:</p>
    <p><ul>
      <li>Everything on the forms is true and correct, or you have been informed or believe it to be true and correct, and</li>
      <li>You understand that making a false statement on the forms is perjury and has penalties provided by law.</li></ul></p>
  <p>See the <a href="https://www.ilga.gov/legislation/ilcs/documents/073500050k1-109.htm"><b>Illinois Code of Civil Procedure, 735 ILCS 5/1-109</b></a> for more information.</p>
  </div>
fields:
  - "Add e-signature?": e_signature
    datatype: yesnoradio
terms:
  - "e-signature": |
      An e-signature is an electronic signature. It is a digital version of a signature that has the same effect as a hand-written signature.











---
