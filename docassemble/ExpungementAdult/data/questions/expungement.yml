rows: records
columns:
  - Arrest date: |
      row_item.arrest_date if defined("row_item.arrest_date") else ""
  - Eligible for expungement: |
      word(yesno(row_item.ex_eligible)) if defined("row_item.ex_eligible") else ""
  - Eligible for sealing: |
      word(yesno(row_item.se_eligible)) if defined("row_item.se_eligible") else ""
  - What do you want to do?: |
      row_item.include.capitalize() if defined("row_item.include") and defined("row_item.ex_eligible") and defined("row_item.se_eligible") and (row_item.ex_eligible or row_item.se_eligible) else ""
edit:
  - review_records_details
delete buttons: True
confirm: True
---
id: record details review screen
continue button field: x.review_records_details
generic object: DAObject
question: |
  Edit record details
subquestion: |
  <div class="alert alert-info ilao-info" role="alert">
    <h6 class="alert-heading">Information about criminal records relief</h6>
    <p><ul>
      <li><a href="${url_action('expungement_info')}"><b>Clearing your criminal record in Illinois</b></a></li>
      <li><a href="${url_action('more_expungement_info')}"><b>Obstacles to clearing your criminal record</b></a></li>
      <li><a href="${url_action('records_info')}"><b>Two kinds of criminal records</b></a></li>
      <li><a href="${url_action('more_records_info')}"><b>How to view or get copies of your criminal records</b></a></li>
    </p>
  </div>

  Edit your answers below.
  
  **Note:** Changing these details may affect eligibility for expungement and sealing. Be sure to review your forms before filing.
review: 
  - Edit: x.arrest_date
    button: |
      **Arrest date:**
      ${ x.arrest_date  }
  - Edit: x.traffic
    button: |
      **Was this for a minor traffic offense (Class C misdmeanor)?**
      ${ word(yesno(x.traffic))}
  - Edit: x.rwc
    button: |
      **Were you released without being charged after the arrest?**
      ${word(yesno(x.rwc))}
  - Edit: x.after_arrest
    button: |
      **What happened as a result of the arrest?**

      % if x.after_arrest == "dismissed":
      * I was charged, but was later **acquitted** or the case was **dismissed**.
      % elif x.after_arrest == "diversion":
      * I participated in a problem-solving court, pre-plea **diversion**, or post-plea diversion program.
      % elif x.after_arrest == "qualified_probation":
      * I received a sentence of **Qualified Probation**. This might also be called Second Chance, 410, 710, 1410, or TASC probation.
      % elif x.after_arrest == "weapons":
      * I participated in the **First Time Weapon Offense Program**.
      % elif x.after_arrest == "drugs":
      * I received a sentence for a **controlled substance**.
      % elif x.after_arrest == "supervision":
      * I received a sentence of **supervision**.
      % else:
      * I was **convicted** and received a sentence of jail or prison time, a different kind of probation, conditional discharge, time considered served, or a fine.
      % endif
  - Edit: x.diversion_status
    button: |
      **What is the status of the problem-solving court or diversion program?**

      % if x.diversion_status == "complete":
      * I successfully completed the program.
      % elif x.diversion_status == "soon":
      * I expect to successfully complete the program within 61 days of filing my request to expunge.
      % else:
      * I did not complete the program.
      % endif
    show if: x.after_arrest == "diversion"
  - Edit: x.qp_type
    button: |
      **What kind of Qualified Probation did you receive?**

      % if x.qp_type == "second":
      * Second chance
      % else:
      * Another type of Qualified Probation such as 410, 710, 1410, or TASC probation
      % endif
    show if: x.after_arrest == "qualified_probation"
  - Edit: x.qp_complete
    button: |
      **Did you successfully complete your Qualified Probation?**
      ${word(yesno(x.qp_complete))}
    show if: x.after_arrest == "qualified_probation"
  - Edit: x.qp_complete_plus_5
    button: |
      **Have at least 5 years passed since you successfully completed your Qualified Probation?**
      ${word(yesno(x.qp_complete_plus_5))} 
    show if: x.after_arrest == "qualified_probation" and x.qp_complete and x.qp_type != "second"
  - Edit: x.supervision_exclusion
    button: |
      **Was your supervision for an excludable offense?**

      % if x.supervision_exclusion == "dui":
      * Yes, it was for Driving Under the Influence.
      % elif x.supervision_exclusion == "minor":
      * Yes, it was for a sexual offense against a person under the age of 18.
      % elif x.supervision_exclusion == "reckless":
      * Yes, it was for Reckless Driving.
      % else:
      * No, it was for something other than a DUI, a sexual offense against a minor, or Reckless Driving.
      % endif
    show if: x.after_arrest == "supervision"
  - Edit: x.reckless_was_under_25
    button: |
      **Were you under age 25 at the time of the Reckless Driving offense?**
      ${word(yesno(x.reckless_was_under_25))}
    show if: x.after_arrest == "supervision" and x.supervision_exclusion == "reckless"
  - Edit: x.reckless_other
    button: |
      **Do you have any other convictions for DUI or Reckless Driving?**
      ${word(yesno(x.reckless_other))}
    show if: x.after_arrest == "supervision" and x.supervision_exclusion == "reckless" and x.reckless_was_under_25
  - Edit: x.reckless_now_25
    button: |
      **Are you now age 25 or older?**
      ${word(yesno(x.reckless_now_25))}
    show if: x.after_arrest == "supervision" and x.supervision_exclusion == "reckless" and x.reckless_was_under_25 and not x.reckless_other
  - Edit: x.supervision_needs_5
    button: |
      **Was your supervision for any of these offenses?**
      ${word(yesno(x.supervision_needs_5))}

      * Domestic Battery
      * Criminal Sexual Abuse (victim was 18 or older)
      * Driving without insurance
      * Driving when registration is suspended for Non-Insurance
      * Display of false insurance Card
      * Scrap processor's failure to keep records
    show if: x.after_arrest == "supervision" and x.supervision_exclusion == "none"
  - Edit: x.supervision_complete
    button: |
      **Did you successfully complete your supervision?**
      ${word(yesno(x.supervision_complete))}
    show if: x.after_arrest == "supervision" and x.supervision_exclusion == "none"
  - Edit: x.supervision_complete_plus_5
    button: |
      **Have at least 5 years passed since you successfully completed your supervision?**
      ${word(yesno(x.supervision_complete_plus_5))}
    show if: x.after_arrest == "supervision" and x.supervision_exclusion == "none" and x.supervision_needs_5
  - Edit: x.supervision_complete_plus_2
    button: |
      **Have at least 2 years passed since you successfully completed your supervision?**
      ${word(yesno(x.supervision_complete_plus_2))}
    show if: x.after_arrest == "supervision" and x.supervision_exclusion == "none" and not x.supervision_needs_5
  - Edit: x.weapons_complete
    button: |
      **Did you successfully complete the First Time Weapon Offense program?**
      ${word(yesno(x.weapons_complete))}
    show if: x.after_arrest == "weapons"
  - Edit: x.drugs_complete
    button: |
      **Did you successfully complete the sentence for a controlled substance?**
      ${word(yesno(x.drugs_complete))}
    show if: x.after_arrest == "drugs"
  - Edit: x.reversed_none
    button: |
      **Did any special situations apply?**
      ${word(yesno(not x.reversed_none))}
      
      * The conviction was reversed or vacated,
      * You received a pardon or a Certificate of Eligibility for Expungement or Sealing, or
      * You were you found by a court that you were factually innocent in the case.
    show if: x.after_arrest == "conviction"    
  - Edit: x.reversed_none
    button: |
      **What special situation(s) applied?**
      
      % if x.reversed:
      * I was convicted, but the conviction was reversed or vacated.
      % endif
      % if x.pardon:
      * I received a pardon from the Governor of the State of Illinois allowing expungement.
      % endif
      % if x.certificate_ex:
      * I received a Certificate of Eligibility for **Expungement** by the Prisoner Review Board.
      % endif
      % if x.certificate_se:
      * I received a Certificate of Eligibility for **Sealing** by the Prisoner Review Board.
      % endif
      % if x.innocent:
      * I was found by a court that I am factually innocent in the case.
      % endif
    show if: x.after_arrest == "conviction" and not x.reversed_none
      
  - Edit: x.is_felony
    button: |
      **What type of offense were you charged with?**

      % if x.is_felony:
      * A felony.
      % else:
      * A misdemeanor or ordinance violation.
      % endif
    show if: x.include != "expunge"
    
  - Edit: x.reckless_conviction
    button: |
      **Was your conviction for Reckless Driving?**
      ${word(yesno(x.reckless_conviction))}
    show if: x.after_arrest == "conviction"
  - Edit: x.reckless_was_under_25_conviction
    button: |
      **Were you under age 25 at the time of the Reckless Driving offense?**
      ${word(yesno(x.reckless_was_under_25_conviction))}
    show if: x.after_arrest == "conviction" and x.reckless_conviction
  - Edit: x.reckless_other_conviction
    button: |
      **Do you have any other convictions for DUI or Reckless Driving?**
      ${word(yesno(x.reckless_other_conviction))}
    show if: x.after_arrest == "conviction" and x.reckless_conviction and x.reckless_was_under_25_conviction
  - Edit: x.reckless_now_25_conviction
    button: |
      **Are you now age 25 or older?**
      ${word(yesno(x.reckless_now_25_conviction))}
    show if: x.after_arrest == "conviction" and x.reckless_conviction and x.reckless_was_under_25_conviction and not x.reckless_other_conviction
  - Edit: x.unsealable
    button: |
      **Did the arrest result in a supervision or conviction for something in these categories?**
      ${word(yesno(x.unsealable))}

      * Some Driving Offenses
      * Domestic Battery
      * Violation of an Order of Protection, Civil No Contact Order, or Stalking No Contact Order
      * Some Sexual Offenses
      * Some Animal Offenses
    show if: x.after_arrest == "conviction" or x.after_arrest == "supervision"
  - Edit: x.must_register
    button: |
      **Do you have to register on a public registry for this offense?**
      ${word(yesno(x.must_register))}
    show if: x.after_arrest == "conviction"
  - Edit: x.human_trafficking
    button: |
      **Were you a victim of human trafficking when the offense was committed?**
      ${word(yesno(x.human_trafficking))}
  - Edit: x.discharge_type
    button: |
      **After the conviction, did you receive a sentence of conditional discharge or probation, or did you complete an Illinois prison or jail sentence?**

      % if x.discharge_type == "complete":
      * Yes, I completed a sentence of conditional discharge or probation and the sentence **was not revoked**.
      % elif x.discharge_type == "revoked":
      * Yes, I received a sentence of conditional discharge or probation and the sentence **was revoked**.
      % elif x.discharge_type == "jail":
      * Yes, I completed an Illinois prison or jail sentence.
      % else:
      * No, I did not receive a sentence of conditional discharge or probation. I did not complete an Illinois prison or jail sentence.
      % endif
    show if: x.after_arrest == "conviction"

  - Edit: x.eligibility
    button: |
      % if x.ex_eligible or x.se_eligible:
      **Eligible for:**
      
      % if x.ex_eligible:
      * Expungement
      % endif
      % if x.se_eligible:
      * Sealing
      % endif
      
      **Include records in your *Request*?**
      % if x.include == "expunge":
      Yes, I want to **expunge** these records.
      % elif x.include == "seal":
      Yes, I want to **seal** these records.
      % else:
      No, I do not want to include these records.
      % endif
      % else:
      **Not eligible for expungement or sealing**[NEWLINE]
      Based on your answers, records related to this arrest are not eligible for expungement or sealing.[NEWLINE]
      **Note:** This could change if you edit your other answers.
      % endif
      
  - Edit: x.case_number
    button: |  
      **Case or arrest number:**
      ${ x.case_number}
    show if: x.include == "expunge" or x.include == "seal"
  - Edit: x.agency
    button: |
      % if x.include == "expunge":
      **Details about the records to expunge:**
      % else:
      **Details about the records to seal:**
      % endif

      **Arresting agency:** ${ x.agency }

      **Charge:** ${ x.charge }

      **Outcome code:**
      % if x.include == "expunge":
      ${ x.ex_outcome }
      % endif
      % if x.include == "seal":
      ${ x.se_outcome}
      % endif
    show if: x.include == "expunge" or x.include == "seal"

continue button label: Next

---
id: about you review screen
section: About you
event: section_user
question: |
  About you
subquestion: |
  <div class="alert alert-info ilao-info" role="alert">
    <h6 class="alert-heading">Information about criminal records relief</h6>
    <p><ul>
      <li><a href="${url_action('expungement_info')}"><b>Clearing your criminal record in Illinois</b></a></li>
      <li><a href="${url_action('more_expungement_info')}"><b>Obstacles to clearing your criminal record</b></a></li>
      <li><a href="${url_action('records_info')}"><b>Two kinds of criminal records</b></a></li>
      <li><a href="${url_action('more_records_info')}"><b>How to view or get copies of your criminal records</b></a></li>
    </p>
  </div>
  
  Edit your answers below.
review:
  - Edit: users[0].name.first
    button: |
      **Your name:**
      ${ users[0].name_full() }
  - Edit: users[0].has_other_names
    button: |
      **Do you have any other names that were used in your cases or arrests?**
      ${word(yesno(users[0].has_other_names))}
      % if users[0].has_other_names:
      [NEWLINE][NEWLINE]**Other names:** ${other_user_names }
      % endif      
  - Edit: users[0].birthdate
    button: |
      **When were you born?**
      ${ users[0].birthdate }
  - Edit: users[0].race
    button: |
      **What is your race?**
      % if users[0].race == 'other':
      ${ user_race_other }
      % else:
      ${ users[0].race }
      % endif
  - Edit: users[0].gender
    button: |
      **What is your gender?**
      % if users[0].gender == 'other':
      ${ user_gender_other }
      % else:
      ${ users[0].gender }
      % endif      
  - Edit: users[0].address.address
    button: |
      **Your address:**[NEWLINE]
      ${ users[0].address.on_one_line(bare=True) }
  - Edit: users[0].phone_number
    button: |
      **Your phone number:**
      % if users[0].phone_number == "":
      None entered
      % else:
      ${ phone_number_formatted(users[0].phone_number) }
      % endif
  - Edit: users[0].has_email_address
    button: |
      **Do you have an email address?**
      ${ word(yesno(users[0].has_email_address)) }
  - Edit: users[0].email
    button: |
      **Your email:**
      ${ users[0].email }
    show if: users[0].has_email_address
  - Edit: add_order_recipient
    button: |
      **Do you want the court to send the order to another person or address?**
      ${ word(yesno(add_order_recipient)) }      
  - Edit: order_recipient.name.first
    button: |
      **Send order to this person:**
      ${ order_recipient.name_full() }
    show if: add_order_recipient
  - Edit: order_recipient.address.address
    button: |
      **${ order_recipient.name_full() }'s address:**[NEWLINE]
      ${ order_recipient.address.on_one_line(bare=True) }
    show if: add_order_recipient
  - Edit: order_recipient.phone_number
    button: |
      **${ order_recipient.name_full() }'s phone number:**
      % if order_recipient.phone_number == "":
      None entered
      % else:
      ${ phone_number_formatted(order_recipient.phone_number) }
      % endif
    show if: add_order_recipient
  - Edit: order_recipient.email
    button: |
      **${ order_recipient.name_full() }'s email:**
      ${ order_recipient.email }
    show if: add_order_recipient    
  - Edit: e_signature
    button: |
      **Do you want to add your e-signature to your forms?**
      ${ word(yesno(e_signature)) }