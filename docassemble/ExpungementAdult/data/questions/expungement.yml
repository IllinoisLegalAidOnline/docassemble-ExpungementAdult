reconsider: True
code: |
  any_eligible_records = any(getattr(record, 'include', False) in ("expunge", "seal") for record in records)
---
reconsider: True
code: |
  temp_list_ex = []
  temp_list_se = []
  for record in records:
    if getattr(record, 'include', False) == "expunge":
      temp_list_ex.append(record)
    elif getattr(record, 'include', False) == "seal":
      temp_list_se.append(record)
  include_ex = DAList("include_ex", elements = temp_list_ex)
  include_se = DAList("include_se", elements = temp_list_se)
  include_all = DAList("include_all", elements = temp_list_ex + temp_list_se)

  ################## set expungement checkbox variables ###################

  ex_reversed_any = False
  ex_pardon_any = False
  ex_cert_any = False
  ex_innocent_any = False
  ex_rwc_any = False
  ex_minor_traffic_any = False
  ex_dismissed_any = False
  ex_diversion_any = False
  ex_diversion_complete_now_any = False
  ex_diversion_complete_soon_any = False
  ex_qp_complete_5_any = False
  ex_supervision_any = False
  ex_supervision_complete_5_any = False
  ex_supervision_complete_2_any = False
  ex_not_supervision_exclusion_any = True # based on current form text, this is always checked since Easy Form will only allow eligible offenses to be expunged
  ex_reckless_driving = False
  
  if include_ex.number() > 0:
    for record in include_ex:

      record.ex_outcome

      if record.rwc:
        ex_rwc_any = True
        if record.traffic:
          ex_minor_traffic_any = True
        continue

      if record.after_arrest == "dismissed":
        ex_dismissed_any = True
        continue
        
      if record.after_arrest == "conviction":
        if not record.reversed_none:
          if record.reversed:
            ex_reversed_any = True
          if record.pardon:
            ex_pardon_any = True
          if record.certificate_ex:
            ex_cert_any = True
          if record.innocent:
            ex_innocent_any = True
        continue

      if record.after_arrest == "diversion":
        ex_diversion_any = True
        if record.diversion_status == "complete":
          ex_diversion_complete_now_any = True
          continue
        if record.diversion_status == "soon":
          ex_diversion_complete_soon_any = True
          continue

      if record.after_arrest == "qualified_probation":
        if record.qp_complete:
          if record.qp_complete_plus_5:
            ex_qp_complete_5_any = True
            continue

      if record.after_arrest == "supervision":
        ex_supervision_any = True
      if record.supervision_exclusion == "reckless":
        if record.reckless_was_under_25:
          if not record.reckless_other:
            if record.reckless_now_25:
              ex_reckless_driving = True
              continue
      if record.supervision_needs_5:
        if record.supervision_complete_plus_5:
          ex_supervision_complete_5_any = True
          continue
      elif record.supervision_complete_plus_2:
        ex_supervision_complete_2_any = True
        continue

  ################## set sealing checkbox variables ###################

  se_qp_complete_no_wait = False
  se_supervision_2 = False
  se_misdemeanor_2 = False
  se_drugs_complete_2 = False
  se_felony_conviction_2 = False
  se_felony_probation_revoked_3 = False
  se_felony_jail_3 = False
  se_not_registry = True # based on current form text, this is always checked since Easy Form will only allow eligible offenses to be sealed
  se_cert = False
  se_education_goal = False
  se_human_trafficking = False
  se_reckless_driving = False

  if include_se.number() > 0:
    for record in include_se:

      record.se_outcome
  
      if record.rwc:
        continue

      if record.after_arrest == "dismissed" or record.after_arrest == "dismissed":
        continue

      if record.after_arrest == "conviction":
        if not record.reversed_none:
          if record.certificate_se:
            se_cert = True
            continue
        if record.reckless_conviction:
          if record.reckless_was_under_25_conviction:
            if not record.reckless_other_conviction:
              if record.reckless_now_25_conviction:
                se_reckless_driving = True
                continue

        # -----------moved inside conviction-----------
        if record.is_felony:
          if record.discharge_type == "complete":
            se_felony_conviction_2 = True
            continue
          else:  
            if ed_program_complete:
              se_education_goal = True
              continue
            if record.discharge_type == "revoked":
              se_felony_probation_revoked_3 = True
              continue
            else:
              se_felony_jail_3 = True
        else:
          se_misdemeanor_2 = True
    
        # -----------moved inside conviction-----------

      if defined('record.human_trafficking'):
        if record.human_trafficking:
          se_human_trafficking = True
          continue
  
      if record.after_arrest == "diversion":  
        continue
  
      if record.after_arrest == "qualified_probation":
        if record.qp_complete:
          if record.qp_type == "second":
            se_qp_complete_no_wait = True
            continue

      if record.after_arrest == "weapons":  
        se_qp_complete_no_wait = True
        continue
  
      if record.after_arrest == "supervision":
        if record.supervision_exclusion == "reckless":
          if record.reckless_was_under_25:
            if not record.reckless_other:
              if record.reckless_now_25:
                se_reckless_driving = True
                continue
        if record.supervision_exclusion == "none":
          se_supervision_2 = True
          continue 

      if record.after_arrest == "drugs":
        if record.drugs_complete:
          if record.drugs_complete_plus_2:
            se_drugs_complete_2 = True
          continue
  
  build_case_lists = True
