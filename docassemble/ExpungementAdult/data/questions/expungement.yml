metadata:
  title: Expunge or seal criminal records
  short title: Expunge or seal criminal records
  comment: This program helps you ask the court to expunge or seal arrests and convictions from your adult criminal record.
  authors:
    - Matt Newsted
---
include:
  - docassemble.AssemblyLine:assembly_line.yml
  - docassemble.ILAO:ilao-interview-framework.yml
  - docassemble.ILAO:shared-basic-questions.yml
---
objects:
  - users: ALPeopleList.using(there_are_any=True)
  - records: DAList.using(object_type=Thing, complete_attribute='complete', there_are_any=True)  

---
