template: minor_traffic_help
subject: |
  **What is a minor traffic offense?**
content: |  
  A **minor traffic offense** is when you break a traffic law, but it is less serious than other offenses. Usually you will just get a ticket and will not be arrested. Minor traffic offenses include:

  * Driving without insurance
  * Speeding
  * Broken tail light
  * Cracked windshield
  * Expired automobile registration

  Check your RAP sheet and court records. Sometimes these offenses are charged as something higher than a Class C misdemeanor. If the minor traffic offense was charged as a Class A or B misdemeanor, you can ask for it to be expunged or sealed.    
