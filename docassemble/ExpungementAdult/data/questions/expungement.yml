  % if x[i].include == "seal" and (getattr(x[i], 'after_arrest', False) == "diversion" or getattr(x[i], 'after_arrest', False) == "qualified_probation" or getattr(x[i], 'after_arrest', False) == "supervision"):
  
  **Note:** If you:

  * Received Supervision,
  * Received Qualified Probation, or
  * Participated in problem-solving court, pre-plea diversion, or a post-plea diversion program

  and **did not complete** it, list the outcome as a **conviction**. Select **MC** - Misdmeanor Conviction or **FC** - Felony Conviction depending on your situation.
  % endif
  % if x[i].include == "expunge" and getattr(x[i], 'after_arrest', False) == "diversion":
  
  **Note:** If you successfully completed problem-solving court, pre-plea diversion, or a post-plea diversion program, list the outcome as **DA** - Dismissal or Acquittal. The case must be **dismissed** before it can be expunged.
  % endif  
fields:
  - Arresting agency: x[i].agency
    maxlength: 50
    help: |
      This is the police department that arrested you.
  - Charge: x[i].charge
    input type: area
    rows: 2
    maxlength: 80
    help: |
      This is the name of the offense you were charged with, such as "retail theft" or "cannabis possession."
  - "What was the outcome of the arrest?[NEWLINE][NEWLINE]**Note:** You may have entered this already. The outcome code is used on a different part of the forms.": x[i].ex_outcome
    datatype: radio
    choices:
      - "**RWC** - Released Without Charge": RWC
      - "**DA** - Dismissal or Acquittal, Finding of No Probable Cause (FNPC), Found Not Guilty (FNG), Nolle Prosequi, Non-Suit, Stricken Off with Leave to Reinstate (SOL)": DA
      - "**S** - Court Supervision, Completed successfully": S
      - "**QP** - First Offender Drug Probation or Qualified Probation, Completed successfully": QP
      - "**FI** - Found Factually Innocent": FI
      - "**RV** - Guilty / Conviction Reversed or Vacated": RV
      - "**P** - Guilty / Conviction with a Pardon from the Governor": P
      - "**CE** - Guilty / Conviction with a Certificate of Eligibility for Expungement from Prisoner Review Board": CE
    show if: 
      code: |
        records[i].include == "expunge"
  - note: |
      ${ collapse_template(expungement_outcomes_help) }
    show if: 
      code: |
        records[i].include == "expunge"         
  - "What was the outcome of the arrest?[NEWLINE][NEWLINE]**Note:** You may have entered this already. The outcome code is used on a different part of the forms.": x[i].se_outcome
    datatype: radio
    choices:
      - "**MC** - Misdemeanor Conviction - Guilty / Sentenced to: IDOC (Illinois Department of Corrections) or County Departments of Corrections (jail), Conditional Discharge, Probation (not Qualified Probation), or Fine (without court supervision)": MC
      - "**FC** - Felony Conviction - Guilty / Sentenced to: IDOC (Illinois Department of Corrections) or County Departments of Corrections (jail), Conditional Discharge, Probation (not Qualified Probation), or Fine (without court supervision)": FC
      - "**CE** - Guilty / Conviction with a Certificate of Eligibility for Sealing from PRB": CE
      - "**QP** - Qualified Probation, completed successfully": QP
    show if: 
      code: |
        records[i].include == "seal"      
  - note: |
      ${ collapse_template(sealing_outcomes_help) }
    show if: 
      code: |
        records[i].include == "seal"      
