code: |
  def eligibility_check( record ):

    # all offenses have baseline of not expungeable or sealable. eligibility and waiting periods applied through remaining logic.
    record.ex_eligible = False
    record.se_eligible = False

    # minor traffic offenses not eligible unless rwc
    if record.traffic and not record.rwc:
      return
  
    if record.rwc:
      record.ex_eligible = True
      record.ex_when = "now"
      return 
  
    if record.after_arrest == "dismissed":
      record.ex_eligible = True
      record.ex_when = "now"
      return  
  
    if record.after_arrest == "conviction":
      if not record.reversed_none:
        if record.reversed or record.pardon or record.certificate_ex or record.certificate_se or record.innocent:
          if record.certificate_se or record.certificate_ex:
            if record.certificate_se:
              record.se_eligible = True
              record.se_when = "now"
            if record.certificate_ex:
              record.ex_eligible = True
              record.ex_when = "now"
            return
          else:
            record.ex_eligible = True
            record.ex_when = "now"
            return
      if record.reckless_conviction:
        if record.reckless_was_under_25_conviction:
          if not record.reckless_other_conviction:
            if record.reckless_now_25_conviction:
              record.se_eligible = True  
              if record.is_felony:
                record.se_when = "3"
              else:
                record.se_when = "2"  
              return  
      if record.unsealable:
        return
      else:
        if record.must_register:
          return
        record.se_eligible = True
        if record.human_trafficking:
          record.se_when = "last"
          return
        if record.discharge_type == "complete":
          record.se_when = "2"
          return
        if record.discharge_type == "revoked" or record.discharge_type == "jail":
          if ed_program_complete:
            record.se_when = "last"
            return
        if record.is_felony:  
          record.se_when = "3"
        else:
          record.se_when = "2"  
        return
  
    if record.after_arrest == "diversion":
      if record.diversion_status == "incomplete":
        record.se_eligible = True
        if record.is_felony:
          record.se_when = "3"
        else:
          record.se_when = "2"  
        return
      elif record.diversion_status == "complete":
        record.ex_eligible = True
        record.ex_when = "now"
        return
      else: # will complete diversion within 61 days
        record.ex_eligible = True
        record.ex_when = "61"
        return
  
    if record.after_arrest == "qualified_probation":
      if record.qp_complete:
        record.ex_eligible = True
        if record.qp_complete_plus_5:
          record.ex_when = "5 qp now"
          return
        else:
          record.ex_when = "5 qp"
        record.se_eligible = True
        record.se_when = "2"
        if record.qp_type == "second":
          record.se_when = "now"  
        return
      else:
        record.se_eligible = True
        if record.is_felony:
          record.se_when = "3"
        else:
          record.se_when = "2"  
        return

    if record.after_arrest == "weapons":
      record.se_eligible = True
      if record.weapons_complete:
        record.se_when = "now"  
      else:
        if record.is_felony:
          record.se_when = "3"
        else:
          record.se_when = "2"  
      return

    if record.after_arrest == "drugs":
      record.se_eligible = True
      if record.drugs_complete:
        record.ex_eligible = True
        record.ex_when = "5"
        if record.drugs_complete_plus_2:
          record.se_when = "2 drugs now"        
        else:
          if record.is_felony:
            record.se_when = "3"
          else:
            record.se_when = "2"  
      else:
        if record.is_felony:
          record.se_when = "3"
        else:
          record.se_when = "2"  
      return
  
    if record.after_arrest == "supervision":

      # code added to skip unsealable question if special reckless driving relief allowed 
      if not (getattr(record, 'reckless_was_under_25', False) and not getattr(record, 'reckless_other', True) and getattr(record, 'reckless_now_25', False)) and record.unsealable:
        return
  
      # code replaced by the above
      # if record.unsealable:
      #   return
  
      if record.supervision_exclusion == "none":  
        if not record.supervision_complete:
          record.se_eligible = True
          record.se_when = "2"  
          return
       # these options are for supervision complete 
        if record.supervision_needs_5:
          if record.supervision_complete_plus_5:
            record.ex_eligible = True
            record.ex_when = "5 sup now"
            record.se_eligible = True
            record.se_when = "2"  
            return
          else: 
            record.ex_eligible = True
            record.ex_when = "5 sup" 
            record.se_eligible = True
            record.se_when = "2"  
            return  
        else:
          if record.supervision_complete_plus_2:
            record.ex_eligible = True
            record.ex_when = "2 sup now"
            record.se_eligible = True
            record.se_when = "2"  
            return
          else:
            record.ex_eligible = True
            record.ex_when = "2 sup"
            record.se_eligible = True
            record.se_when = "2"  
            return
  
      # check for supervision expungement exclusions: dui, sex offense v minor, or reckless driving
      if record.supervision_exclusion == "dui" or record.supervision_exclusion == "minor":
        record.se_eligible = True
        record.se_when = "2"  
        return
      else: # reckless driving
        if record.reckless_was_under_25:
          if not record.reckless_other:
            if record.reckless_now_25:
              record.ex_eligible = True
              record.ex_when = "now"
              return
        else: # will catch supervision for reckless driving but over 25
          if record.supervision_complete:
            if record.supervision_complete_plus_2:
              record.ex_eligible = True
              record.ex_when = "2 sup"
              return
        record.se_eligible = True  
        record.se_when = "2"  
        return

    return
    # draft logic for all other records - might not ever be called
    # record.se_eligible = True
    # if record.is_felony:
    #   record.se_when = "3"
    # else:
    #   record.se_when = "2"  
    # return

---
code: |
  def format_waiting_period( period ):
    if period == "now":
      return "**right now**."
    elif period == "last":
      return "after you complete your **{last sentence}**."
    elif period == "2":
      return "**two years** after you complete your **{last sentence}**."
    elif period == "2 sup":
      return "**two years** after you successfully complete your supervision, and two years must pass since the end of the sentence for all other supervisions."
    elif period == "2 sup now":
      return "**right now**, based on your answer that it has been at least two years since your successfully completed your supervision."
    elif period == "2 drugs now":
      return "**right now**, based on your answer that it has been at least two years since you completed your **{last sentence}**."
    elif period == "3":
      return "**three years** after you complete your **{last sentence}**."
    elif period == "5":
      return "**five years** after you complete your **{last sentence}**."
    elif period == "5 sup":
      return "**five years** after you successfully complete your supervision."
    elif period == "5 sup now":
      return "**right now**, based on your answer that it has been at least five years since your successfully completed your supervision."
    elif period == "5 qp":
      return "**five years** after your Qualified Probation ended successfully."
    elif period == "5 qp now":
      return "**right now**, based on your answer that it has been at least five years since your Qualified Probation ended successfully."
    elif period == "61":
      return "after you successfully complete your problem-solving court or diversion program within 61 days of filing your expungement request."
    else:
      return "waiting period unknown"  
---
terms:
  - last sentence: |
      **Last sentence** means the latest completion date of any sentence you received in Illinois or any other state.
---
code: |
  def relief_list( record ):
  
    relief = []
    if record.ex_eligible:
      relief.append( { "expunge" : "Yes, I want to **expunge** these records." })
    if record.se_eligible:
      relief.append( { "seal" : "Yes, I want to **seal** these records." })
    relief.append( { "not include" : "No, I do not want to include these records." })
    return relief
---
id: eligibility report
