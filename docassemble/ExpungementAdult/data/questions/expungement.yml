---
id: welcome
question: |
  Expunge or seal criminal records
subquestion: |
  Welcome to Illinois Legal Aid Online's **Expunge or seal criminal records** Easy Form.

  This program helps you make a *${ form_name }*.
field: sees_nav_bar
---
id: instructions
continue button field: how_to_use
question: |
  Instructions
subquestion: |
  To fill out the forms, you will need to know:

  * Things

  Set aside 15 to 45 minutes to finish this program. You can log in and save your work to continue later. 
 
  ${ collapse_template(help_example) }  

  Click on **{green words}** to learn what they mean. Some questions have a question mark in a circle ${ fa_icon("question-circle", color_css="#0dcaf0" ) } that also gives help.
---
template: help_example
subject: |
  **You can click sections like this to show more information.**
content: |  
  This is an example of help. Click again to hide.
---
id: eligible records
question: |
  Eligible records
subquestion: |
  This Easy Form can remove eligible police or court records for criminal offenses in Illinois.
  
  It cannot help with these kinds of records:

  * Juvenile
  * Federal
  * Criminal records outside Illinois
  * Minor traffic cases
  * Eviction records
  * Cannabis misdemeanor or felony convictions
continue button field: eligible_records
---
id: info about first record
question: |
  Information about the first record
subquestion: |
  WHERE TO FIND INFO
fields:
  - Arrest date: records[0].arrest_date
    datatype: ThreePartsDate
    alMax: ${ today().format("yyyy-MM-dd") }    
---
id: info about other records
question: |
  Information about a ${ ordinal(i) } record
subquestion: |
  WHERE TO FIND INFO
fields:
  - Arrest date: records[i].arrest_date
    datatype: ThreePartsDate
    alMax: ${ today().format("yyyy-MM-dd") }    
---
id: any other records
question: |  
  Do you want to remove any other records?
subquestion: |
  So far you have told us about these arrests or cases:
  
  % for record in records:
  * Arrest date: ${record.arrest_date}
  % endfor

  The forms have room for up to 24 records.
fields:
  - "Any other records?": records.there_is_another
    datatype: yesnoradio
---
id: result in conviction
question: |
  Did the ${records[i].arrest_date} arrest result in a conviction? 
subquestion: |
  Select **Yes** if...

  Select **No** if...
fields:
  - Conviction?: records[i].conviction
    datatype: yesnoradio
---
id: expungement conviction special status
question: |
  Do any of these apply to the conviction from the ${records[i].arrest_date} arrest? 
subquestion: |
  These special situations might make the records eligible for expungement.

  If none of these apply, click **Next**.
fields:
  - "I was convicted, but the conviction was reversed or vacated.": records[i].reversed
    datatype: yesnowide
  - "I received a pardon from the Governor of the State of Illinois allowing expungement.": records[i].pardoned
    datatype: yesnowide
  - "I received a Certificate of Eligibility for Expungement by the Prisoner Review Board.": records[i].certificate
    datatype: yesnowide
  - "I was found by a court that I am factually innocent in the case.": records[i].factually_innocent
    datatype: yesnowide

---
id: expungement rwc
question: |
  Were you released without being charged for the ${records[i].arrest_date} arrest? 
subquestion: |
  Select **Yes** if you were arrested or brought into the police station, but you were released and no charges were ever filed against you.
fields:
  - "Arrested and released without being charged?": records[i].rwc
    datatype: yesnoradio
  - "Was this for a minor traffic offense?": records[i].rwc_traffic
    datatype: yesnoradio
    show if:
      variable: records[i].rwc
      is: True



---
id: expungement after arrest
question: |
  What happened as a result of the ${records[i].arrest_date} arrest?
fields:
  - no label: records[i].after_arrest
    datatype: radio
    choices:
      - "I was charged, but was later **acquitted** or the case was **dismissed**. This could appear on your court records as *Nolle Prosequi*, Stricken Off With Leave to Reinstate (SOL), non-suit, or dismissal. The court could have issued a finding of no probable cause.": dismissed          
      - "I participated in a problem-solving court, pre-plea **diversion**, or post-plea diversion program.": diversion
      - "I received a sentence of **Qualified Probation**. This might also be called Second Chance, 410, 710, 1410, or TASC probation.": qualified_probation
      - "I received a sentence of **supervision**.": supervision
      - "I was **convicted** and received a sentence of jail or prison time, a different kind of probation, conditional discharge, time considered served, or a fine.": conviction
  - note: |
      **Note:** You can select **convicted** even if:
      
      * The conviction was reversed or vacated,
      * You received a pardon from the Governor of the State of Illinois allowing expungement,
      * You received a Certificate of Eligibility for Expungement by the Prisoner Review Board, or
      * You were found by a court that you are factually innocent in the case.
---
id: expungement diversion status
question: |
  Problem-solving court or diversion program completion
subquestion: |
  You said you participated in a problem-solving court, pre-plea diversion, or post-plea diversion program. 
fields:
  - note: |
      Which of these is true?
  - no label: records[i].diversion_status
    datatype: radio
    choices:
      - "I successfully completed the program.": complete
      - "I expect to successfully complete the program within 61 days of filing my request to expunge.": soon
      - "I did not complete the program.": incomplete
---
id: expungement qualified probation status
question: |
  Qualified Probation completion
subquestion: |
  You said you received a sentence of Qualified Probation. This might also be called Second Chance, 410, 710, 1410, or TASC probation.
fields:
  - Was this a sentence of **Second Chance, 410, 710, 1410, or TASC** probation?: records[i].qp_second_chance
    datatype: yesnoradio
  - Did you successfully complete your Qualified Probation?: records[i].qp_complete
    datatype: yesnoradio
  - Have at least **5 years** passed since you successfully completed your Qualified Probation?: records[i].qp_complete_plus_5
    datatype: yesnoradio
    show if:
      variable: records[i].qp_complete
      is: True
---
id: supervision exclusions
question: |
  Was your supervision for any of these offenses?
subquestion: |
  You said you received a sentence of supervision.
  
  ---
fields:
  - Was it for any of these offenses?: records[i].supervision_exclusion
    datatype: radio
    choices:
      - Driving Under the Influence: dui
      - Any sexual offense against a person under the age of 18: minor
      - Reckless Driving: reckless
      - "None of the above": none
  - "Were you under age 25 when you received supervision for Reckless Driving?": records[i].reckless_was_under_25
    datatype: yesnoradio
    show if:
      variable: records[i].supervision_exclusion
      is: "reckless"
  - Do you have any other convictions for DUI or Reckless Driving?: records[i].reckless_other
    datatype: yesnoradio
    js show if: |
      val("records[i].supervision_exclusion") == "reckless" && val("records[i].reckless_was_under_25")
  - Are you now age 25 or older?: records[i].reckless_now_25
    datatype: yesnoradio
    js show if: |
      val("records[i].supervision_exclusion") == "reckless" && val("records[i].reckless_was_under_25") && val("records[i].reckless_other") == false
---
id: expungement supervision
question: |
  Supervision details
subquestion: |
  You said you received a sentence of supervision.
  
  ---
fields:
  - note: |
      Was your supervision for any of these offenses?

      * Domestic Battery
      * Criminal Sexual Abuse
      * Driving without Insurance
      * Driving with Registration Suspended for Non-Insurance
      * Display of False Insurance Card
      * Scrap Processors to Keep Records    
  - no label: records[i].supervision_needs_5
    datatype: yesnoradio
  - Did you successfully complete your supervision?: records[i].supervision_complete
    datatype: yesnoradio
  - Have at least **5 years** passed since you successfully completed your supervision?: records[i].supervision_complete_plus_5
    datatype: yesnoradio
    js show if: |
      val("records[i].supervision_complete") && val("records[i].supervision_needs_5")
  - Have at least **2 years** passed since you successfully completed your supervision?: records[i].supervision_complete_plus_2
    datatype: yesnoradio
    js show if: |
      val("records[i].supervision_complete") && val("records[i].supervision_needs_5") == false
---
id: offense type
question: |
  What type of offense were you charged with on ${ records[i].arrest_date }?
subquestion: |
  This can affect how long you have to wait before you are eligible for criminal records relief.
fields:
  - Offense type: records[i].is_felony
    datatype: radio
    choices:
    - "Misdemeanor or an ordinance violation": False
    - "Felony": True

---
id: supervision or conviction unsealable
question: |
  Did the ${ records[i].arrest_date } arrest result in a supervision or conviction in one of these areas? 
subquestion: |
  THIS SEALING QUESTION WILL BE ADJUSTED TO ASK ABOUT EXCEPTIONS
  
  Driving Offenses
  o Driving Under the Influence (625 ILCS 5/11-501)
  o Reckless Driving (unless under 25 at the time of the offense and no other convictions for DUI or reckless driving) (625 ILCS 5/11-503)

  Domestic Battery (720 ILCS 5/12-3.2)

  Violation of an Order of Protection (720 ILCS 5/12-3.4), Civil No-Contact Order (740 ILCS 22), or Stalking No-Contact Order (740 ILCS 21/1-135)

  Sexual Offenses
  o Soliciting a Prostitute or Patronizing a Prostitute (720 ILCS 5/11-18)
  o Public Indecency (720 ILCS 5/11-30) if convicted of a felony (misdemeanor convictions are eligible)
  o Any other misdemeanor offense listed under Article 11 of the Criminal Code (with the exception of Prostitution) (720 ILCS 5/11)
  o Any offense that requires registration under the Sex Offender Registration Act

  Animal Offenses
  o Dog Fighting (720 ILCS 5/48-1)
  o Class A misdemeanors under the Humane Care for Animals Act, such as beating or tormenting an animal, or abandonment (510 ILCS 70/3.01; 510 ILCS 70/4.03; 510 ILCS 70/5; 510 ILCS 70/5.01; 510 ILCS 70/6; 510 ILCS 70/7.15)
fields:
  - Any of these offenses?: records[i].unsealable
    datatype: yesnoradio




---
code: |
  def any_special_ex( record ):

    if record.reversed or record.pardoned or record.certificate or record.factually_innocent:
      return True
    else:
      return False
---
code: |
  records[i].arrest_date
  
  if not records[i].rwc:
    records[i].after_arrest
    if not records[i].after_arrest == "dismissed":  
      if records[i].after_arrest == "diversion":
        records[i].diversion_status
      if records[i].after_arrest == "qualified_probation":
        records[i].qp_complete
      if records[i].after_arrest == "supervision":
        if records[i].supervision_exclusion == "none":
          records[i].supervision_complete
      if records[i].after_arrest == "conviction":
        records[i].reversed
        if not any_special_ex( records[i] ):
          records[i].is_felony
   
  # adjust when to ask for unsealable
  #if not records[i].rwc:
  #  records[i].unsealable    

  # maybe in here add check for exp kick-out for convictions with finding of guilt
  
  eligibility_check( records[i] )
  # for sealing eligibility maybe ask if ed goal reached to adjust waiting period - careful!
  records[i].eligibility_report
  records[i].complete = True
---
code: |
  def eligibility_check( record ):

    # all offenses have baseline of not expungeable or sealable. eligibility and waiting periods applied through remaining logic.
    record.ex_eligible = False
    record.se_eligible = False

    if record.rwc:
      record.ex_eligible = True
      record.ex_when = "now"
      return 

    if record.after_arrest == "dismissed":
      record.ex_eligible = True
      record.ex_when = "now"
      return  
  
    if record.after_arrest == "conviction":
      if record.reversed or record.pardoned or record.certificate or record.factually_innocent:
        record.ex_eligible = True
        record.ex_when = "now"
        return
  
    if records[i].after_arrest == "diversion":
      if records[i].diversion_status == "incomplete":
        record.se_eligible = True
        record.se_when = "now"
        return
      elif records[i].diversion_status == "complete":
        record.ex_eligible = True
        record.ex_when = "now"
        return
      else: # will complete diversion within 61 days
        record.ex_eligible = True
        record.ex_when = "61"
        return
  
    if record.after_arrest == "qualified_probation":
      if record.qp_complete and record.qp_complete_plus_5:
        record.ex_eligible = True
        record.ex_when = "5"
        record.se_eligible = True
        record.se_when = "2"
        return
      else:
        record.se_eligible = True
        if record.is_felony:
          record.se_when = "3"
        else:
          record.se_when = "2"  
        return

    if record.after_arrest == "supervision":
      # this section has not been built out - add criteria for all supervision

      if record.supervision_exclusion == "none":  
        if not records[i].supervision_complete:
          record.se_eligible = True
          if record.is_felony:
            record.se_when = "3"
          else:
            record.se_when = "2"  
          return
       # these options are for supervision complete 
        if record.supervision_needs_5:
          if records[i].supervision_complete_plus_5:
            record.ex_eligible = True
            record.ex_when = "now"
            return
          else:
            record.se_eligible = True
            if record.is_felony:
              record.se_when = "3"
            else:
              record.se_when = "2"  
            return
        else:
          if records[i].supervision_complete_plus_2:
            record.ex_eligible = True
            record.ex_when = "now"
            return
          else:
            record.se_eligible = True
            if record.is_felony:
              record.se_when = "3"
            else:
              record.se_when = "2"  
            return
  
          if record.supervision_needs_2:
            if records[i].supervision_complete_plus_2:
              record.ex_eligible = True
              record.ex_when = "now"
              return
            else:
              record.se_eligible = True
              if record.is_felony:
                record.se_when = "3"
              else:
                record.se_when = "2"  
              return
  
      # check for supervision expungement exclusions: dui, sex offense v minor, or reckless driving
      if record.supervision_exclusion == "dui" or record.supervision_exclusion == "minor":
        record.se_eligible = True
        if record.is_felony:
          record.se_when = "3"
        else:
          record.se_when = "2"  
        return
      else: # reckless driving
        if record.reckless_was_under_25:
          if not record.reckless_other:
            if record.reckless_now_25:
              record.ex_eligible = True
              record.ex_when = "now"
              return
        record.se_eligible = True  
        if record.is_felony:
          record.se_when = "3"
        else:
          record.se_when = "2"  
        return
  
    # logic for all other records
    record.se_eligible = True
    if record.is_felony:
      record.se_when = "3"
    else:
      record.se_when = "2"  
    return


      

        
---
id: eligibility report
generic object: DAList
continue button field: x[i].eligibility_report
question: |
  Eligibility summary
subquestion: |
  Based on your answers, records from the ${x[i].arrest_date} arrest are eligible for:

  % if x[i].ex_eligible:
    * Expungement, ${format_waiting_period ( x[i].ex_when ) }
  % endif
  
  % if x[i].se_eligible:
    * Sealing, ${format_waiting_period ( x[i].se_when ) }
  % endif

  % if not x[i].ex_eligible and not x[i].se_eligible:
  * Neither expungement or sealing
  % endif
---
code: |
  def format_waiting_period( period ):
    if period == "now":
      return "right now."
    elif period == "2":
      return "**two years** after you complete your **last** sentence."
    elif period == "3":
      return "**three years** after you complete your **last** sentence."
    elif period == "5":
      return "**five years** after you complete your **last** sentence."
    elif period == "61":
      return "after you successfully complete your problem-solving court or diversion program within 61 days of filing your expungement request."
    else:
      return "waiting period unknown"

  
