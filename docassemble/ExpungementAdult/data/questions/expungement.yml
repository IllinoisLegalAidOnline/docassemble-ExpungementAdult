id: welcome
question: |
  Expunge or seal criminal records
subquestion: |
  Welcome to Illinois Legal Aid Online's **Expunge or seal criminal records** Easy Form.

  This program helps you make a *${ form_name }*. It can be used to clear criminal records of the:
  
  * Offenses for which you were arrested,
  * Offenses you were charged with, and
  * Outcome of those cases, including any sentences you received.

  Most criminal records are cleared by **{expungement}** or **{sealing}**.
  
  To learn more, see ILAO's information on [**expunging or sealing a criminal record**](https://www.illinoislegalaid.org/node/37706).
field: sees_nav_bar
---
id: instructions
continue button field: how_to_use
question: |
  Instructions
subquestion: |
  To fill out the forms, you will need:

  * Court records (might be called a "docket sheet" or a "**{disposition}**") for all of your criminal cases,
  * Your Illinois State Police Statewide Criminal History Transcript, and
  * If you had arrests or charges in Chicago, your Chicago Police RAP Sheet (Record of Arrests and Prosecutions).

  **Note:** In a few screens, we will explain how you can view or get copies of your criminal records.

  Set aside 15 to 45 minutes to finish this program. You can log in and save your work to continue later. 
 
  ${ collapse_template(help_example) }  

  Click on **{green words}** to learn what they mean. Some questions have a question mark in a circle ${ fa_icon("question-circle", color_css="#0dcaf0" ) } that also gives help.
---
template: help_example
subject: |
  **You can click sections like this to show more information.**
content: |  
  This is an example of help. Click again to hide.
---
terms:
  - "expungement": |
      **Expungement**: Erases or removes records from public view and destroys them, as if the arrest or charge never happened.
  - "sealing": |
      **Sealing**: Hides or restricts access to the record, but the record still exists. Law enforcement and employers that require a fingerprint background check can still see it.
  - "disposition": |
      A **disposition** is the final judgment or outcome in a court case. There are no court dispositions for arrests or charges that did not lead to a court case.
---
id: read or skip information
question: |
  More information about clearing your criminal record
subquestion: |
  To get detailed information about clearing your criminal record, you may want to start with ILAO's [**Before filing for expungement or sealing FAQ**](https://www.illinoislegalaid.org/node/185296).

  You can also read more on the next four screens of this Easy Form. If you want to read more information now, click **Yes**. You can go through it before making your forms.

  If you want to read more information later, click **No**. It is linked on any Review screen. Just click **:edit: Edit answers** later in the Easy Form.  Also, the information will be included in the instructions you can download when you get your forms.

  **Note:** We recommend you read this information now. If you miss something, you can always come back to it later. 
fields:
  - Read more information about criminal records now?: read_or_skip
    datatype: yesnoradio
---
id: expungement info
continue button field: expungement_info
question: |
  Clearing your criminal record in Illinois
subquestion: |
  When you are arrested or charged with an offense, a criminal record is created, even if you are not found guilty. Your criminal records can be read by the public, including your family, friends, employers, trade organizations, banks, and credit agencies. To have your record erased or hidden you must file a *${ form_name }* with the court and have a judge approve your *Request*.

  There are three ways to clear your criminal record:

  * **Expungement**: Erases arrests, dismissed charges, court supervisions, and qualified probations that were completed successfully from your criminal record so it is like they never happened.
  * **Sealing**: Hides convictions on your criminal record from most of the public. Law enforcement agencies can still see sealed records. Employers required by law to conduct background checks can see sealed felony convictions. They cannot see sealed misdemeanor convictions or cases not resulting in convictions unless the employer is a law enforcement agency.
  * **Executive Clemency**: If you do not qualify for expungement or sealing, you can apply for a pardon from the Governor forgiving you for your criminal convictions. A pardon does not erase or hide your conviction on its own. If you get a pardon authorizing expungement, you can then apply to have your record expunged. To learn more about getting a pardon, read ILAO's article about [**executive clemency**](https://www.illinoislegalaid.org/node/37761).
---
id: more expungement info
continue button field: more_expungement_info
question: |
  Obstacles to clearing your criminal records
subquestion: |
  You might not be eligible for getting your criminal records expunged or sealed if:
  
  * You have any pending criminal charges,
  * You have not completed your sentence, including parole, probation, or court supervision,
  * Your records for some offenses are not eligible for expungement or sealing, or
  * A required waiting period for sealing your offense has not passed yet.

  Also, police departments and prosecutors for your criminal cases get a chance to object to your *Request* to expunge or seal your criminal record.

  * The police departments and prosecutors have 60 days from the day they receive your *Request* to file a written objection with the court. If they **object**, it means they do not want your record to be expunged or sealed. If the agencies do not object during the 60 days, they cannot object at a later time.
  * An **objection** does not mean the court is denying your *Request*. The court will consider the objection when deciding if your criminal record will be expunged or sealed.
---
id: records info
continue button field: records_info
question: |
  Two kinds of criminal records
subquestion: |
  There are two types of criminal records: court records and police records. You do not need to pay for copies of all of your criminal records.

  **Court records**

  * You will need records for all of your court cases. This may be called a "docket sheet" or a "disposition." A disposition is the final judgment or outcome in a court case. There are no court dispositions for arrests or charges that did not lead to a court case.

  **Police records**

  * An Illinois State Police Statewide Criminal History Transcript lists most arrests and convictions that happened in Illinois.
  * A Chicago RAP Sheet (Record of Arrests and Prosecutions) lists all arrests, charges, and court case outcomes that happened in Chicago.
---
id: more records info
continue button field: more_records_info
question: |
  How to view or get copies of your criminal records
subquestion: |
  Records from the **Circuit Clerk**: Many court records are available online. Some counties, like Cook County, do not provide online access to criminal records.
  ${ collapse_template(clerk_records_help) } 
  
  Records from the **Illinois State Police**: You are allowed to access your entire criminal history information from the Illinois State Police. Although not required, it is the best available source for your statewide criminal record. Please note, there might be discrepancies or missing information.
  ${ collapse_template(isp_records_help) }

  Records from the **Chicago Police Department**: If you were arrested in Chicago, you must get your records from the Chicago Police Department. Order a RAP sheet from the Chicago Police Department if you were arrested in Chicago. There will be a fee.
  ${ collapse_template(cpd_records_help) }
---
template: clerk_records_help
subject: |
  **How to access records from the Circuit Clerk**
content: |  
  If you cannot find your court records online, go to the Circuit Clerk's Office in the county where your case was filed. Ask the Circuit Clerk for the information you need to fill out the forms. This information can be found in your court records.
  
  You may be able to use the public computer at the Circuit Clerk's office to look up records and print them out or write down the information. Copies are available for a fee. Find your Circuit Clerk's website at: [ilcourts.info/clerks](https://ilcourts.info/clerks).
---
template: isp_records_help
subject: |
  **How to access records from the Illinois State Police**
content: |
  You can get a "Statewide Criminal History Transcript" in 3 ways:

  * From the Illinois State Police:[NEWLINE]
    Illinois State Police[NEWLINE]
    Bureau of Identification[NEWLINE]
    260 North Chicago Street[NEWLINE]
    Joliet, Illinois 60432[NEWLINE]
    (815) 740-5160[NEWLINE]
    [isp.illinois.gov/BureauOfIdentification](https://isp.illinois.gov/BureauOfIdentification)

  * From your local law enforcement agency:[NEWLINE]
    Every law enforcement agency is allowed to provide you this information. Check with your local law enforcement agency to find out costs and times for fingerprinting.

  * From any licensed LiveScan vendor to get your transcript using your fingerprint. Find a Fingerprint Vendor at the [Illinois Department of Financial and Professional Regulation](https://idfprapps.illinois.gov/licenselookup/fingerprintlist.asp) website.
---
template: cpd_records_help
subject: |
  **How to access records from the Chicago Police Department**
content: |
  To access records from the Chicago Police Department:
  
  * You must go to the Chicago Police Department to get your Chicago RAP sheet:[NEWLINE]
    Chicago Police Headquarters[NEWLINE]
    3510 S. Michigan Ave.[NEWLINE]
    Chicago, IL[NEWLINE]
    (312) 745-5508[NEWLINE]
  
  * You will receive your RAP sheet in the mail.
  
  * You should also request a copy of your Illinois State Police Statewide Criminal History Transcript. The Chicago Police will provide your state record for no additional cost.
---
id: eligible records
question: |
  Dealing with different kinds of records
subquestion: |
  This Easy Form can remove eligible police or court records for **adult criminal offenses** in Illinois. It cannot help with these kinds of records:

  * Juvenile (see below)
  * Cannabis misdemeanor or Class 4 felony convictions (see below)
  * Eviction records (see below)
  * Minor traffic cases (Class C misdemeanor or lower)
  * Criminal records outside Illinois
  * Federal

  You can use our [**Expunge juvenile records**](https://www.illinoislegalaid.org/node/30856) Easy Form to clear eligible offenses from your juvenile record.
  
  Cannabis records can be cleared in different ways. Some records qualify for automatic expungement. Others can be vacated and expunged. To learn more about cannabis records relief, read ILAO's article about [**clearing your record**](https://www.illinoislegalaid.org/node/165861). You can use our [Cannabis expungement](https://www.illinoislegalaid.org/node/173941) Easy Form if you want to expunge cannabis-related convictions.

  If you want to remove an eviction from the public record, use our [**Remove eviction from public record**](https://www.illinoislegalaid.org/node/183526) Easy Form.
continue button field: eligible_records
---
id: immigration status info
continue button field: immigration_status_info
question: |
  Immigration status
subquestion: |
  Expunging or sealing a criminal record does not erase it for immigration purposes. US immigration authorities can still see expunged or sealed records. Applicants for immigration benefits may need to disclose criminal records to immigration, including juvenile offenses.

  **Important:** Expunging or sealing records may make it more difficult for someone to provide them to immigration. Speak to an immigration lawyer before filing to expunge or seal any criminal or juvenile records. Use **[Get Legal Help](https://www.illinoislegalaid.org/get-legal-help)** to find free or low-cost legal services in your area.

  To learn more, read ILAO's article, [**Should I clear my criminal record for immigration purposes?**](https://www.illinoislegalaid.org/node/51801)
---
id: whats next
continue button field: whats_next
question: |
  After you finish this program
subquestion: |
  Once you download your forms, you must file them with the court. This program **does not file** your forms for you. To learn about the filing process, see ILAO's [**Court process for expungement or sealing FAQ**](https://www.illinoislegalaid.org/node/185996).

  There may be fees to get records from police departments, certified dispositions, or court filing fees. There also may be an Illinois State Police processing fee to process your expungement or sealing court order. The Circuit Clerk collects this fee with the filing fee.

  **Note:** If you cannot afford the Circuit Clerk filing fee or the Illinois State Police processing fee, you can ask the court to waive those fees. You can use ILAO's [**Fee waiver Easy Form**](https://www.illinoislegalaid.org/node/30831) to make forms to ask the court to file for free or at a reduced cost.

  After you file the *${ form_name }* and get a court date, you may need to go to court for a court date in front of a judge. Some counties schedule a court date right away, but others will only schedule a court date if there is an objection to your *Request*.

  Finally, the court will decide on your *Request*. To learn about what happens after the court makes its decision, read ILAO's [**After your expungement or sealing case is decided FAQ**](https://www.illinoislegalaid.org/node/186001).
  
  You can read the instructions you can download at the end of this program to learn more about what's next and how to get additional help.
---
