id: filing county
question: |
  In which county do you want to expunge or seal your criminal records?
subquestion: |
  This Easy Form will make forms to expunge or seal criminal offenses that took place **within a single county**.

  If you have been arrested, charged with an offense, or convicted in more than one county, you will have a criminal record in each county. To expunge or seal your criminal records in more than one county, you will have to use this Easy Form once for each county.

  **Note:** You will have to file forms in each county separately and you may have to pay criminal record, filing, or processing fees in each county.
fields:
  - County: filing_county
    code:
      court_list._load_courts()["address_county"].unique()
---
id: info about first record
question: |
  Information about the first record
subquestion: |
  ${ collapse_template(where_to_find_records_help) }
  
  If you need help understanding your court records or RAP sheet, see ILAO's article about [abbreviations on your RAP sheet](https://www.illinoislegalaid.org/node/37641).  
