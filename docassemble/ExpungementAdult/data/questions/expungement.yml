id: eligibility report
generic object: DAList
continue button field: x[i].eligibility_report
question: |
  Eligibility
subquestion: |
  Based on your answers, records from the ${x[i].arrest_date} arrest may be eligible for:

  % if x[i].ex_eligible:
    * Expungement, ${format_waiting_period ( x[i].ex_when ) }
  % endif
  
  % if x[i].se_eligible:
    * Sealing, ${format_waiting_period ( x[i].se_when ) }
  % endif

  % if not x[i].ex_eligible and not x[i].se_eligible:
  * Neither expungement or sealing
  % endif
---
# adjust this function for last sentence for sealing eligibility. now=end of last sentence.
code: |
  def format_waiting_period( period ):
    if period == "now":
      return "right now."
    elif period == "last":
      return "after you complete your **{last sentence}**."
    elif period == "2":
      return "**two years** after you complete your **{last sentence}**."
    elif period == "3":
      return "**three years** after you complete your **{last sentence}**."
    elif period == "5":
      return "**five years** after you complete your **{last sentence}**."
    elif period == "61":
      return "after you successfully complete your problem-solving court or diversion program within 61 days of filing your expungement request."
    else:
      return "waiting period unknown"  
---
terms:
  - last sentence: |
      **Last sentence** means the latest completion date of any sentence you received in Illinois or any other state.
---
id: include records
generic object: DAList
question: |
  Do you want to include records from the ${x[i].arrest_date} arrest in your *Request*?
subquestion: |
  Based on your answers, records from the ${x[i].arrest_date} arrest may be eligible for:

  % if x[i].ex_eligible:
    * Expungement, ${format_waiting_period ( x[i].ex_when ) }
  % endif
  
  % if x[i].se_eligible:
    * Sealing, ${format_waiting_period ( x[i].se_when ) }
  % endif
 
  **Note:** You should only file to expunge or seal records after any waiting periods.
fields:
  - Include these records in your *Request*?: x[i].include
    datatype: radio
    code: |
      relief_list( records[i] )
---
code: |
  def relief_list( record ):
  
    relief = []
    if record.ex_eligible:
      relief.append( { "expunge" : "Yes, I want to **expunge** these records." })
    if record.se_eligible:
      relief.append( { "seal" : "Yes, I want to **seal** these records." })
    relief.append( { "nope" : "No, I do not want to include these records." })
    return relief
---
id: case or arrest number
generic object: DAList
continue button field: x[i].case_number
question: |
  Case or arrest number for the ${x[i].arrest_date} arrest
subquestion: |
  If you have a case number, enter the case number. If you do not have a case number, then enter the arrest number.

  If there is also a municipal ordinance code case number or a warrant arrest number for this offense, enter those in the **Other record numbers** field. If there is more than one, separate them by a comma.
fields:
  - Case or arrest number: x[i].case_number
    maxlength: 30
  - "Other record numbers": x[i].other_numbers
    maxlength: 45
    required: False
---

id: more record details
generic object: DAList
continue button field: x[i].charge
question: |
  More about the ${x[i].arrest_date} arrest
subquestion: |
  TODO - Add where to find this info

  % if x[i].include == "seal": 
  **Note:** If you received Supervision or Qualified Probation and did not complete it, list the outcome as a conviction. Select Misdmeanor Conviction or Felony Conviction depending on your situation.
  % endif
fields:
  - Arresting agency: x[i].agency
    maxlength: 50
    help: |
      This is the police department that arrested you.
  - Charge (List all charges from this arrest): x[i].charge
    input type: area
    rows: 3
    maxlength: 100
    help: |
      This is the name of the offense you were charged with, such as "retail theft" or "cannabis possession."
  - What was the outcome of the arrest?: x[i].ex_outcome
    datatype: radio
    choices:
      - "**RWC** - Released Without Charge": RWC
      - "**DA** - Dismissal or Acquittal, Finding of No Probable Cause (FNPC), Found Not Guilty (FNG), Nolle Prosequi, Non-Suit, Stricken Off with Leave to Reinstate (SOL)": DA
      - "**S** - Court Supervision, Completed successfully": S
      - "**QP** - First Offender Drug Probation or Qualified Probation, Completed successfully Completed": QP
      - "**FI** - Found Factually Innocent": FI
      - "**RV** - Guilty / Conviction Reversed or Vacated": RV
      - "**P** - Guilty / Conviction with a Pardon from the Governor": P
      - "**CE** - Guilty / Conviction with a Certificate of Eligibility for Expungement from Prisoner Review Board": CE
    show if: 
      code: |
        records[i].include == "expunge"
  - note: |
      ${ collapse_template(expungement_outcomes_help) }
    show if: 
      code: |
        records[i].include == "expunge"         
  - What was the outcome of the arrest?: x[i].se_outcome
    datatype: radio
    choices:
      - "**MC** - Misdemeanor Conviction - Guilty / Sentenced to: IDOC (Illinois Department of Corrections) or County Departments of Corrections (jail), Conditional Discharge, Probation (not Qualified Probation), or Fine (without court supervision)": MC
      - "**FC** - Felony Conviction - Guilty / Sentenced to: IDOC (Illinois Department of Corrections) or County Departments of Corrections (jail), Conditional Discharge, Probation (not Qualified Probation), or Fine (without court supervision)": FC
      - "**CE** - Guilty / Conviction with a Certificate of Eligibility for Sealing from PRB": CE
      - "**QP** - Qualified Probation, completed successfully": QP
    show if: 
      code: |
        records[i].include == "seal"      
  - note: |
      ${ collapse_template(sealing_outcomes_help) }
    show if: 
      code: |
        records[i].include == "seal"      
---
