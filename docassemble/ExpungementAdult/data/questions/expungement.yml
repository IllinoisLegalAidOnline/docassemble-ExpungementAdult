---
code: |
  def build_sealing_outcomes():
    sealing_outcomes.auto_gather = False
    sealing_outcomes.clear()
    sealing_outcomes.append({
      'abbreviation': 'MC or FC',
      'disposition': 'IDOC (Illinois Department of Corrections) or County Departments of Corrections (jail)',
      'more_information': 'You were found guilty of an offense. You were sentenced to time in jail or prison.'
    })
    sealing_outcomes.append({
      'abbreviation': 'MC or FC',
      'disposition': 'Conditional Discharge',
      'more_information': 'You were found guilty of an offense. You were sentenced to comply with certain conditions, but you did not have to report to a probation officer.'
    })
    sealing_outcomes.append({
      'abbreviation': 'MC or FC',
      'disposition': 'Probation (not Qualified Probation)',
      'more_information': 'You were found guilty of an offense. You were sentenced to report to a Probation Officer.'
    })
    sealing_outcomes.append({
      'abbreviation': 'MC or FC',
      'disposition': 'Fine (without court supervision)',
      'more_information': 'You were found guilty of an offense. You were sentenced to pay a fine.'
    })
    sealing_outcomes.append({
      'abbreviation': 'CE',
      'disposition': 'Guilty/Conviction with a Certificate of Eligibility for Sealing from the Prisoner Review Board',
      'more_information': 'You were found guilty of an offense, but you petitioned the Prisoner Review Board and were granted eligibility to seal a conviction from your criminal record.'
    })
    sealing_outcomes.append({
      'abbreviation': 'QP',
      'disposition': 'Qualified Probation Successfully Completed',
      'more_information': 'This type of probation can also be called 410, 710, 1410, or TASC probation when the court determines the arrest was a result of alcohol or drug addiction and must be reflected in the record. You can tell if you received this special type of probation by the court disposition.'
    })
    sealing_outcomes.gathered = True
    return
