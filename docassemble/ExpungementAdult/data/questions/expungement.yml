question: |
  % if x[i].ex_eligible and x[i].se_eligible:
  Records from the ${x[i].arrest_date} arrest may be eligible for expungement or sealing
  % elif x[i].ex_eligible or x[i].se_eligible:
  % if x[i].ex_eligible:
  Records from the ${x[i].arrest_date} arrest may be eligible for expungement
  % elif x[i].se_eligible:
  Records from the ${x[i].arrest_date} arrest may be eligible for sealing
  % endif  
  % else:
  Records from the ${x[i].arrest_date} arrest not eligible
  % endif
subquestion: |
  % if x[i].ex_eligible or x[i].se_eligible:
  Based on your answers, records from the ${x[i].arrest_date} arrest may be eligible for:

  % if x[i].ex_eligible:
    * **Expungement**, ${format_waiting_period ( x[i].ex_when ) }
  % endif
  
  % if x[i].se_eligible:
    * **Sealing**, ${format_waiting_period ( x[i].se_when ) }

  % if defined('ed_program_complete'):
  % if ed_program_complete:
  The waiting period for sealing may have been reduced since you completed an educational goal during your last sentence.
  
  % endif
  % endif
  % endif
  <div class="alert alert-info ilao-info" role="alert">
    <h6 class="alert-heading">Definitions: Expungement and sealing</h6>
    <p><b>Expungement:</b> Erases or removes records from public view and destroys them, as if the arrest or charge never happened.</p>
    <p><b>Sealing:</b> Hides or restricts access to the record, but the record still exists. Law enforcement and employers that require a fingerprint background check can still see it.</p>
  </div>
  **Important:** You should only file to expunge or seal records after any waiting periods.
  % else:  
  Based on your answers, records from the ${x[i].arrest_date} arrest are not eligible for expungement or sealing.
  % endif
  % if x[i].ex_eligible and x[i].se_eligible:

  ${ collapse_template(exp_or_seal_help) }
  % endif
