  - Do you want to include these records in your *Request*?: x[i].include
    datatype: radio
    code: |
      relief_list( records[i] )
    show if:
      code: |
        records[i].ex_eligible or records[i].se_eligible
---
template: exp_or_seal_help
subject: |
  **What should I do if the records are eligible for both expungement and sealing?**
content: |
  If records following an arrest are eligible for both expungement and sealing, it is generally better to expunge since it fully removes the records. Sometimes you can seal certain records sooner than when you can expunge them. If you have to wait before your record can be expunged, asking the court to seal now might give some relief until you ask the court to expunge later.
  
  Talk to a lawyer if you are unsure about what to do. Use **[Get Legal Help](https://www.illinoislegalaid.org/get-legal-help)** to find free or low-cost legal services in your area.
