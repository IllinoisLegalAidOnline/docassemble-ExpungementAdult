  - Did you successfully complete the sentence?: records[i].drugs_complete
    datatype: yesnoradio
      
---
id: supervision exclusions
question: |
  Was your supervision for any of these offenses?
subquestion: |
  You said you received a sentence of supervision.
  
  ---
fields:
  - Was it for any of these offenses?: records[i].supervision_exclusion
    datatype: radio
    choices:
      - Driving Under the Influence: dui
      - Any sexual offense against a person under the age of 18: minor
      - Reckless Driving: reckless
      - "None of the above": none
  - "Were you under age 25 at the time of the Reckless Driving offense?": records[i].reckless_was_under_25
    datatype: yesnoradio
    show if:
      variable: records[i].supervision_exclusion
      is: "reckless"
  - Do you have any other convictions for DUI or Reckless Driving?: records[i].reckless_other
    datatype: yesnoradio
    js show if: |
      val("records[i].supervision_exclusion") == "reckless" && val("records[i].reckless_was_under_25")
  - Are you now age 25 or older?: records[i].reckless_now_25
    datatype: yesnoradio
    js show if: |
      val("records[i].supervision_exclusion") == "reckless" && val("records[i].reckless_was_under_25") && val("records[i].reckless_other") == false
---
id: supervision
question: |
  Supervision details
subquestion: |
  You said you received a sentence of supervision.
  
  ---
fields:
  - note: |
      Was your supervision for any of these offenses?

      * Domestic Battery
      * Criminal Sexual Abuse
      * Driving without Insurance
      * Driving with Registration Suspended for Non-Insurance
      * Display of False Insurance Card
      * Scrap Processors to Keep Records    
  - no label: records[i].supervision_needs_5
    datatype: yesnoradio
  - Did you successfully complete your supervision?: records[i].supervision_complete
    datatype: yesnoradio
  - Have at least **5 years** passed since you successfully completed your supervision?: records[i].supervision_complete_plus_5
    datatype: yesnoradio
    js show if: |
      val("records[i].supervision_complete") && val("records[i].supervision_needs_5")
  - Have at least **2 years** passed since you successfully completed your supervision?: records[i].supervision_complete_plus_2
    datatype: yesnoradio
    js show if: |
      val("records[i].supervision_complete") && val("records[i].supervision_needs_5") == false
---
id: offense type
question: |
  What type of offense were you charged with on ${ records[i].arrest_date }?
subquestion: |
  This can affect how long you have to wait before you are eligible for criminal records relief.
fields:
  - Offense type: records[i].is_felony
    datatype: radio
    choices:
    - "Misdemeanor or an ordinance violation": False
    - "Felony": True
---
id: reckless driving sealing exclusion
question: |
  Was your conviction for Reckless Driving?
subquestion: |
fields:
  - no label: records[i].reckless_conviction
    datatype: yesnoradio
  - "Were you under age 25 at the time of the Reckless Driving offense?": records[i].reckless_was_under_25_conviction
    datatype: yesnoradio
    show if:
      variable: records[i].reckless_conviction
      is: True
  - Do you have any other convictions for DUI or Reckless Driving?: records[i].reckless_other_conviction
    datatype: yesnoradio
    js show if: |
      val("records[i].reckless_conviction") && val("records[i].reckless_was_under_25_conviction")
  - Are you now age 25 or older?: records[i].reckless_now_25_conviction
    datatype: yesnoradio
    js show if: |
      val("records[i].reckless_conviction") && val("records[i].reckless_was_under_25_conviction") && val("records[i].reckless_other_conviction") == false
---
id: supervision or conviction unsealable
question: |
  Did the ${ records[i].arrest_date } arrest result in a supervision or conviction for any of these offenses? 
subquestion: |
  Convictions and supervisions for these misdemeanors and felonies are not elitible for sealing.
  
  **Driving Offenses**
  
  * Driving Under the Influence ([**625 ILCS 5/11-501**](http://www.ilga.gov/legislation/ilcs/fulltext.asp?DocName=062500050K11-501))
  * Reckless Driving (unless under 25 at the time of the offense and no other convictions for DUI or reckless driving) ([**625 ILCS 5/11-503**](http://www.ilga.gov/legislation/ilcs/fulltext.asp?DocName=062500050K11-503))

  **Domestic Battery** ([**720 ILCS 5/12-3.2**](http://www.ilga.gov/legislation/ilcs/fulltext.asp?DocName=072000050K12-3.2))

  **Violation of an Order of Protection** ([**720 ILCS 5/12-3.4**](http://www.ilga.gov/legislation/ilcs/fulltext.asp?DocName=072000050K12-3.4)), **Civil No-Contact Order** ([**740 ILCS 22**](https://www.ilga.gov/Legislation/ILCS/Articles?ActID=2491&ChapterID=57&Chapter=CIVIL%20LIABILITIES&MajorTopic=RIGHTS%20AND%20REMEDIES)), or **Stalking No-Contact Order** ([**740 ILCS 21/1-135**](http://www.ilga.gov/legislation/ilcs/ilcs3.asp?ActID=3123&ChapterID=57))

  **Sexual Offenses**
  
  * Soliciting a Prostitute or Patronizing a Prostitute ([**720 ILCS 5/11-18**](http://www.ilga.gov/legislation/ilcs/documents/072000050K11-18.htm))
  * Public Indecency ([**720 ILCS 5/11-30**](https://www.ilga.gov/Documents/legislation/ilcs/documents/072000050K11-30.htm)) if convicted of a felony (misdemeanor convictions are eligible)
  * Any other misdemeanor offense listed under Article 11 of the Criminal Code (with the exception of Prostitution) ([**720 ILCS 5/11**](https://www.ilga.gov/legislation/ILCS/details?MajorTopic=&Chapter=&ActName=Criminal%20Code%20of%202012.&ActID=1876&ChapterID=53&ChapAct=720+ILCS+5%2F&SeqStart=14400000&SeqEnd=21000000))
  * Any offense that requires registration under the Sex Offender Registration Act

  **Animal Offenses**
  
  * Dog Fighting ([**720 ILCS 5/48-1**](http://www.ilga.gov/legislation/ilcs/fulltext.asp?DocName=072000050K48-1))
  * Class A misdemeanors under the Humane Care for Animals Act, such as beating or tormenting an animal, or abandonment ([**510 ILCS 70/3.01**](http://www.ilga.gov/legislation/ilcs/fulltext.asp?DocName=051000700K3.01); [**510 ILCS 70/4.03**](http://www.ilga.gov/legislation/ilcs/fulltext.asp?DocName=051000700K4.03); [**510 ILCS 70/5**](http://www.ilga.gov/legislation/ilcs/fulltext.asp?DocName=051000700K5); [**510 ILCS 70/5.01**](http://ilga.gov/legislation/ilcs/documents/051000700K5.01.htm); [**510 ILCS 70/6**](http://www.ilga.gov/legislation/ilcs/fulltext.asp?DocName=051000700K6); [**510 ILCS 70/7.15**](http://www.ilga.gov/legislation/ilcs/documents/051000700K7.15.htm))
fields:
  - Supervision or conviction for any of the above offenses?: records[i].unsealable
    datatype: yesnoradio
---
id: felony conviction conditional discharge
question: |
  Do any of these apply to the conviction from the ${records[i].arrest_date} arrest? 
subquestion: |
  This may affect when records are eligible for sealing.
fields:
  - no label: records[i].discharge_type
    datatype: radio
    choices:
      - "I completed a sentence of conditional discharge or probation and the sentence **was not revoked**.": complete
      - "I received a sentence of conditional discharge or probation and the sentence **was revoked**.": revoked
      - "I completed an Illinois prison or jail sentence.": jail
      - "None of the above": none
---
id: educational goal or career certification
question: |
  Educational goal or career certification
subquestion: |
  You may be able to seal your felony conviction sooner if the following is true:

  * You completed your last sentence,
  * You received a high school diploma, associate's degree, career certificate, vocational or technical certification, bachelor's degree, or passed the high school GED Test,
  * You completed this education goal or career certification during the time of your last sentence, aftercare release, or mandatory supervised release,
  * The felony conviction resulted in prison or jail, or conditional discharge or probation that was revoked, and
  * You did not complete the same educational goal or career certification before.
fields:
  - "Are all of the above true?": ed_program_complete
    datatype: yesnoradio
  - note: |
      **Note:** Attach proof of the educational or career program you completed to your *Request* when you file it.
    show if:
      variable: ed_program_complete
      is: True
---
id: registry question
question: |
  Do you currently have to register on a public registry for this offense?
subquestion: |
  Some felony convictions require you to register on a public registry for a period of time. These include registries through the:
  
  * Arsonist Registration Act,
  * Sex Offender Registration Act, and
  * Murder and Violent Offender Against Youth Registration Act.

  If you had to register but registration period has ended, you can select **No**.
fields:
  - "Do you have to register on a public registry for this offense?": records[i].must_register
    datatype: yesnoradio
---
id: human trafficking question
question: |
  Human trafficking
subquestion: |
  If you are a victim of human trafficking, you may be able to seal eligible cases sooner.
  
  To be eligible, the following must be true:
  
  * You are a trafficking victim as defined under [**Section 10-9 of the Criminal Code of 2012**](https://www.ilga.gov/legislation/ILCS/details?MajorTopic=&Chapter=&ActName=Criminal%20Code%20of%202012.&ActID=1876&ChapterID=53&ChapAct=720+ILCS+5%2F&SeqStart=12400000&SeqEnd=13900000),
  * You were a victim of human trafficking when the offense was committed, and
  * Your participation in the offense was a direct result of human trafficking under Section 10-9 of the Criminal Code of 2012 or a severe form of trafficking under the federal Trafficking Victims Protection Act.

  **Note:** Select **Yes** only if all of the above are true.
fields:
  - "Were you a victim of human trafficking when the offense was committed?": records[i].human_trafficking
    datatype: yesnoradio
---
