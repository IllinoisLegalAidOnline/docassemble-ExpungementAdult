        ${ users[0].race }
        % endif
    - "user_gender": |
        % if users[0].gender == 'other':
        ${ user_gender_other }
        % else:
        ${ users[0].gender }
        % endif
    - "case_number": ${ "" }
    - "user_name_2": ${ order_recipient.name_full() if add_order_recipient else users[0].name_full() }
    - "user_phone": |
        % if add_order_recipient:
        ${ phone_number_formatted(order_recipient.phone_number) }
        % else:
        ${ phone_number_formatted(users[0].phone_number) }
        % endif
    - "user_email": |
        % if add_order_recipient:
        ${ order_recipient.email }
        % else:
        ${ users[0].email if users[0].has_email_address else "" }
        % endif
    - "user_address": |
        % if add_order_recipient:
