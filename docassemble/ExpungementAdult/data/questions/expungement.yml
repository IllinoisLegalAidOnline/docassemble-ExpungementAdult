template: expungement_outcomes_help
subject: |
  **More information about outcomes (Expungement)**
content: |  
  ${ expungement_table }
---
table: expungement_table
rows: expungement_outcomes
columns:
  - Outcome Abbreviation: row_item['abbreviation']
  - Disposition/Outcome: row_item['disposition']
  - More Information: row_item['more_information']
---
code: |
  def build_expungement_outcomes():
    expungement_outcomes.auto_gather = False
    expungement_outcomes.clear()
    expungement_outcomes.append({
      'abbreviation': 'DA',
      'disposition': 'Dismissal',
      'more_information': 'The state stopped prosecuting your case and the court dismissed the case.'
    })
    expungement_outcomes.append({
      'abbreviation': 'DA',
      'disposition': 'Finding of No Probable Cause (FNPC)',
      'more_information': 'The court dismissed the case because it decided that there was no probable cause (reason) to believe that you had committed the offense that you were accused of.'
    })
    expungement_outcomes.append({
      'abbreviation': 'DA',
      'disposition': 'Found Not Guilty (FNG)',
      'more_information': 'The court decided you were not guilty of the offense you were charged with.'
    })
    expungement_outcomes.append({
      'abbreviation': 'DA',
      'disposition': 'Nolle Prosequi',
      'more_information': 'The state stopped prosecuting your case and the court terminated the case.'
    })
    expungement_outcomes.append({
      'abbreviation': 'DA',
      'disposition': 'Non-Suit',
      'more_information': 'The prosecutor has the option to bring the case back up again. If they do not, the case is considered terminated.'
    })
    expungement_outcomes.append({
      'abbreviation': 'DA',
      'disposition': 'Stricken Off with Leave to Reinstate (SOL)',
      'more_information': 'The State has the option to bring the case back up again. If they do not within 120 – 160 days, the case is considered terminated.'
    })
    expungement_outcomes.append({
      'abbreviation': 'RWC',
      'disposition': 'Released without Charging',
      'more_information': 'You were arrested but not charged with an offense or brought to court.'
    })
    expungement_outcomes.append({
      'abbreviation': 'S',
      'disposition': 'Court Supervision, Completed Successfully',
      'more_information': 'The court kept your case open for a set period of time. You followed the conditions during that time and the court dismissed the criminal charges against you.'
    })
    expungement_outcomes.append({
      'abbreviation': 'QP',
      'disposition': 'Successfully completed First Offender Drug Probation or Qualified Probation',
      'more_information': 'This type of probation can also be called 410, 710, 1410, or TASC probation when the court determines the arrest was a result of alcohol or drug addiction and must be reflected in the record. You can tell if you received this special type of probation by the court disposition.'
    })
    expungement_outcomes.append({
      'abbreviation': 'RV',
      'disposition': 'Guilty/Conviction Reversed Or Vacated',
      'more_information': 'You were found guilty of an offense, but the conviction was reversed or vacated.'
    })
    expungement_outcomes.append({
      'abbreviation': 'P',
      'disposition': 'Guilty/Conviction with a Pardon from the Governor',
      'more_information': 'You were found guilty of an offense, but the Governor granted you a pardon that allows the expungement of your criminal record.'
    })
    expungement_outcomes.append({
      'abbreviation': 'CE',
      'disposition': 'Guilty/Conviction with a Certificate of Eligibility for Expungement from the Prisoner Review Board',
      'more_information': 'You were found guilty of an offense, but you petitioned the Prisoner Review Board and were granted eligibility to erase a conviction from your criminal record.'
    })
    expungement_outcomes.gathered = True
    return
---
template: sealing_outcomes_help
subject: |
  **More information about outcomes (Sealing)**
content: |  
  ${ sealing_table }
---
table: sealing_table
rows: sealing_outcomes
columns:
  - Outcome Abbreviation: row_item['abbreviation']
  - Disposition/Outcome: row_item['disposition']
