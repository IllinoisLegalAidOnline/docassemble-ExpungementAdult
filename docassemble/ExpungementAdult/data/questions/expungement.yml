  - instructions: ALDocument.using(title="Instructions", filename="instructions.pdf", has_addendum=False)
  - request: ALDocument.using(title="Request to Expunge or Seal", filename="petition.pdf", has_addendum=False)
  - order_denying_request: ALDocument.using(title="Order Denying Request (draft)", filename="order_denying_request.pdf", has_addendum=False)
---
code: |
  instructions.enabled = True
  request.enabled = True
  order_denying_request.enabled = True
---
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[instructions, request_bundle, order_denying_request], filename="expungement_forms.pdf", title="All forms")
  #- al_court_bundle: ALDocumentBundle.using(elements=[request_bundle, order_denying_request], filename="expungement_forms.pdf", title="All forms")
---
objects:
  - request_bundle: ALDocumentBundle.using(elements=[request], filename="request.pdf", title="Request to Expunge or Seal")
---
attachment:
  variable name: instructions[i]
  name: instructions
  filename: instructions
  editable: False
  skip undefined: True
  pdf template file: instructions.pdf  
  fields:
    - "fake": ${ "" }
