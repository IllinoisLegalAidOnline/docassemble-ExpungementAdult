############### Review page
id: review screen
event: review_answers
question: |
  Review screen
subquestion: |
  <div class="alert alert-info ilao-info" role="alert">
    <h6 class="alert-heading">Information about criminal records relief</h6>
    <p><ul>
      <li><a href="${url_action('expungement_info')}"><b>Clearing your criminal record in Illinois</b></a></li>
      <li><a href="${url_action('more_expungement_info')}"><b>Obstacles to clearing your criminal record</b></a></li>
      <li><a href="${url_action('records_info')}"><b>Two kinds of criminal records</b></a></li>
      <li><a href="${url_action('more_records_info')}"><b>How to view or get copies of your criminal records</b></a></li>
    </p>
  </div>
  
  Edit your answers below.
review:
  - note: |
      <h4>Your records</h4>
  - Edit: filing_county
    button: |
      **County where you want to expunge or seal records:**
      ${ filing_county }
  - Edit: records.revisit
    button: |
      **Records: (Edit to review, change details, or add more)**

      % for my_var in records:
      % if defined("my_var.include"):
      % if my_var.include == "expunge":
        1. Arrest date: ${ my_var.arrest_date }, request to **expunge**
      % elif my_var.include == "seal":
        1. Arrest date: ${ my_var.arrest_date }, request to **seal**
      % else:
        1. Arrest date: ${ my_var.arrest_date }, not included in request
      % endif
      % else:
        1. Arrest date: ${ my_var.arrest_date }
      % endif
      % endfor
  - Edit: ed_program_complete
    button: |
      **Did you complete an educational goal or job certificate program?**
      ${word(yesno(ed_program_complete))} [NEWLINE][NEWLINE]
      **Note:** Changing this answer may affect waiting periods.
      
  - note: |
      <h4>About you</h4>
  - Edit: users[0].name.first
    button: |
      **Your name:**
      ${ users[0].name_full() }
  - Edit: users[0].has_other_names
    button: |
      **Do you have any other names that were used in your cases or arrests?**
      ${word(yesno(users[0].has_other_names))}
      % if users[0].has_other_names:
      [NEWLINE][NEWLINE]**Other names:** ${other_user_names }
      % endif      
  - Edit: users[0].birthdate
    button: |
      **When were you born?**
      ${ users[0].birthdate }
  - Edit: users[0].race
    button: |
      **What is your race?**
      % if users[0].race == 'other':
      ${ user_race_other }
      % else:
      ${ users[0].race }
      % endif
  - Edit: users[0].gender
    button: |
      **What is your gender?**
      % if users[0].gender == 'other':
      ${ user_gender_other }
      % else:
      ${ users[0].gender }
      % endif
  - Edit: users[0].address.address
    button: |
      **Your address:**[NEWLINE]
      ${ users[0].address.on_one_line(bare=True) }
  - Edit: users[0].phone_number
    button: |
      **Your phone number:**
      % if users[0].phone_number == "":
      None entered
      % else:
      ${ phone_number_formatted(users[0].phone_number) }
      % endif
  - Edit: users[0].has_email_address
    button: |
      **Do you have an email address?**
      ${ word(yesno(users[0].has_email_address)) }
  - Edit: users[0].email
    button: |
      **Your email:**
      ${ users[0].email }
    show if: users[0].has_email_address
  - Edit: add_order_recipient
    button: |
      **Do you want the court to send the order to another person or address?**
      ${ word(yesno(add_order_recipient)) }      
  - Edit: order_recipient.name.first
    button: |
      **Send order to this person:**
      ${ order_recipient.name_full() }
    show if: add_order_recipient
  - Edit: order_recipient.address.address
    button: |
      **${ order_recipient.name_full() }'s address:**[NEWLINE]
      ${ order_recipient.address.on_one_line(bare=True) }
    show if: add_order_recipient
  - Edit: order_recipient.phone_number
    button: |
      **${ order_recipient.name_full() }'s phone number:**
      % if order_recipient.phone_number == "":
      None entered
      % else:
      ${ phone_number_formatted(order_recipient.phone_number) }
      % endif
    show if: add_order_recipient
  - Edit: order_recipient.email
    button: |
      **${ order_recipient.name_full() }'s email:**
      ${ order_recipient.email }
    show if: add_order_recipient    
  - Edit: e_signature
    button: |
      **Do you want to add your e-signature to your forms?**
      ${ word(yesno(e_signature)) }
