  - case_list_chunks: DAList.using(auto_gather=False, object_type=DAObject)
  - order_chunks: DAList.using(auto_gather=False, object_type=DAObject)
  - ex_addl_bundle: ALDocumentBundle.using(elements=[], title="Additional records for expungement", filename="additional_expungement.pdf", has_addendum=False)
  - se_addl_bundle: ALDocumentBundle.using(elements=[], title="Additional records for sealing", filename="additional_sealing.pdf", has_addendum=False)
  - case_list_bundle: ALDocumentBundle.using(elements=[], title="Case List for Request", filename="case_list.pdf", has_addendum=False)
  - order_bundle: ALDocumentBundle.using(elements=[], title="Order to Expunge or Seal (draft)", filename="order.pdf", has_addendum=False)
---
code: |
  import math

  MAIN_EX_CAPACITY = 10
  MAIN_SE_CAPACITY = 10
  ADDL_EX_CAPACITY = 7
  ADDL_SE_CAPACITY = 7
  CASE_LIST_CAPACITY = 70
  MAIN_ORDER_EX_CAPACITY = 28
  MAIN_ORDER_SE_CAPACITY = 28
  ADDL_ORDER_EX_CAPACITY = 28
  ADDL_ORDER_SE_CAPACITY = 28

  ex_count = len(include_ex)
  se_count = len(include_se)
  all_count = len(include_all)

  # --- Expungement additional forms ---
  ex_forms_to_bundle = []
  ex_addl_bundle.enabled = False
  ex_record_chunks.clear()

  if ex_count > MAIN_EX_CAPACITY:
    overflow = ex_count - MAIN_EX_CAPACITY
    num_addl = math.ceil(overflow / ADDL_EX_CAPACITY)
    for i in range(num_addl):
      chunk = ex_record_chunks.appendObject(DAObject)
      chunk.chunk_start = MAIN_EX_CAPACITY + (i * ADDL_EX_CAPACITY)
      chunk.chunk_end = min(chunk.chunk_start + ADDL_EX_CAPACITY, ex_count)
      chunk.ex_addl_form = ALDocument(
        chunk.instanceName + '.ex_addl_form',
        title="Additional records for expungement",
        filename="additional_expungement.pdf",
        has_addendum=False
      )
      chunk.ex_addl_form.enabled = True
      ex_forms_to_bundle.append(chunk.ex_addl_form)
      ex_addl_bundle.enabled = True

  ex_record_chunks.gathered = True
  ex_addl_bundle.elements = ex_forms_to_bundle

  # --- Sealing additional forms ---
  se_forms_to_bundle = []
  se_addl_bundle.enabled = False
  se_record_chunks.clear()

  if se_count > MAIN_SE_CAPACITY:
    overflow = se_count - MAIN_SE_CAPACITY
    num_addl = math.ceil(overflow / ADDL_SE_CAPACITY)
    for i in range(num_addl):
      chunk = se_record_chunks.appendObject(DAObject)
      chunk.chunk_start = MAIN_SE_CAPACITY + (i * ADDL_SE_CAPACITY)
      chunk.chunk_end = min(chunk.chunk_start + ADDL_SE_CAPACITY, se_count)
      chunk.se_addl_form = ALDocument(
        chunk.instanceName + '.se_addl_form',
        title="Additional records for sealing",
        filename="additional_sealing.pdf",
        has_addendum=False
      )
      chunk.se_addl_form.enabled = True
      se_forms_to_bundle.append(chunk.se_addl_form)
      se_addl_bundle.enabled = True

  se_record_chunks.gathered = True
  se_addl_bundle.elements = se_forms_to_bundle

  # --- Case list forms ---
  case_list_forms_to_bundle = []
  case_list_bundle.enabled = False
  case_list_chunks.clear()

  num_case_lists = math.ceil(all_count / CASE_LIST_CAPACITY)
  for i in range(num_case_lists):
    chunk = case_list_chunks.appendObject(DAObject)
    chunk.chunk_start = i * CASE_LIST_CAPACITY
    chunk.chunk_end = min(chunk.chunk_start + CASE_LIST_CAPACITY, all_count)
    chunk.case_list_form = ALDocument(
      chunk.instanceName + '.case_list_form',
      title="Case List for Request",
      filename="case_list.pdf",
      has_addendum=False
    )
    chunk.case_list_form.enabled = True
    case_list_forms_to_bundle.append(chunk.case_list_form)
    case_list_bundle.enabled = True

  case_list_chunks.gathered = True
  case_list_bundle.elements = case_list_forms_to_bundle

  # --- Order forms ---
  order_forms_to_bundle = []
  order_chunks.clear()

  num_order_forms = max(
    math.ceil(ex_count / MAIN_ORDER_EX_CAPACITY),
    math.ceil(se_count / MAIN_ORDER_SE_CAPACITY)
  )

  for i in range(num_order_forms):
    chunk = order_chunks.appendObject(DAObject)
    chunk.ex_chunk_start = i * MAIN_ORDER_EX_CAPACITY
    chunk.ex_chunk_end = min(chunk.ex_chunk_start + MAIN_ORDER_EX_CAPACITY, ex_count)
    chunk.se_chunk_start = i * MAIN_ORDER_SE_CAPACITY
    chunk.se_chunk_end = min(chunk.se_chunk_start + MAIN_ORDER_SE_CAPACITY, se_count)
    chunk.order_form = ALDocument(
      chunk.instanceName + '.order_form',
      title="Order to Expunge or Seal",
      filename="order.pdf",
      has_addendum=False
    )
    chunk.order_form.enabled = True
    order_forms_to_bundle.append(chunk.order_form)

  order_chunks.gathered = True
  order_bundle.elements = order_forms_to_bundle

  refresh_record_bundles = True

